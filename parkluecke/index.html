<!doctype html>
<html lang="de">
<head>

<title>Parklücke</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

<body>
<div class="wrap">
  <header>
    <div>
      <h1>Park<em>lücke</em></h1>
      <div class="sub">Minispiel der Garage Games · 5 Fahrzeuge einparken · ohne anzuecken, so schnell wie möglich</div>
    </div>
    <div class="actions">
      <a class="ghost" href="../">Menü</a>
      <button class="ghost" id="restart" type="button">Neu starten</button>
    </div>
  </header>
  <div class="stage">
    <canvas id="cv" aria-label="Parkplatz"></canvas>
    <div class="overlay" id="ov"></div>
  </div>
  <div class="keys">
    <span><kbd>W</kbd> / <kbd>↑</kbd> Gas</span>
    <span><kbd>S</kbd> / <kbd>↓</kbd> bremsen und rückwärts</span>
    <span><kbd>A</kbd> <kbd>D</kbd> / <kbd>←</kbd> <kbd>→</kbd> lenken</span>
    <span><kbd>Leertaste</kbd> Handbremse</span>
    <span><kbd>Enter</kbd> Zeit abbrechen und werten lassen</span>
  </div>
</div>
<script src="../shared/lobby-core.js"></script>
<script src="../shared/net.js"></script>
<script src="../shared/avatars.js"></script>
<script src="../shared/progress.js"></script>
<script src="../shared/garage.js"></script>
<script>
(()=>{
const{W,H,COL,MONO,DISPLAY}=GG;
const cv=document.getElementById('cv'),ctx=GG.canvas(cv),ov=GG.overlay(document.getElementById('ov'));
const DARK=GG.dark,TOP=64,FW=W,FH=H-TOP,PI=Math.PI;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;

/* ---------- Fahrzeuge: jedes lenkt und fährt anders ---------- */
// len/wid in Pixeln, ro = Abstand vom Bezugspunkt (feste Achse) bis zum Heck, L = Radstand
const VEH={
  pkw:    {name:'Kleinwagen',len:84,wid:40,L:52,ro:16,steer:.62,sr:3.4,maxV:190,rev:105,acc:220,kind:'front',col:'rose',hint:'Lenkt vorn, wendig und flott.'},
  traktor:{name:'Traktor',len:80,wid:46,L:46,ro:16,steer:.82,sr:2.6,maxV:125,rev:85,acc:150,kind:'front',col:'sea',hint:'Langsam, dafür ein sehr enger Wendekreis.'},
  bagger: {name:'Bagger',len:108,wid:50,L:58,ro:80,steer:.62,sr:2.2,maxV:115,rev:95,acc:140,kind:'rear',col:'amber',hint:'Lenkt mit der Hinterachse: Das Heck schwenkt aus, die Schaufel bleibt in der Spur.'},
  bus:    {name:'Bus',len:230,wid:52,L:140,ro:50,steer:.74,sr:1.8,maxV:150,rev:75,acc:120,kind:'front',col:'water',hint:'Sehr lang: weit ausholen, das Heck zieht nach innen.'},
  lkw:    {name:'LKW',len:170,wid:52,L:104,ro:40,steer:.62,sr:1.7,maxV:140,rev:75,acc:110,kind:'front',col:'apricot',hint:'Schwer und träge, großer Wendekreis.'},
  panzer: {name:'Panzer',len:120,wid:66,ro:60,maxV:95,rev:75,acc:170,turn:1.25,kind:'tank',col:'lime',hint:'Kettenlenkung: A und D drehen auf der Stelle.'},
  lkwh:   {name:'LKW mit Hänger',len:112,wid:52,L:66,ro:26,steer:.64,sr:1.9,maxV:130,rev:60,acc:110,kind:'front',col:'violet',trailer:{Lt:150,from:34,len:176,wid:52},hint:'Der Hänger schneidet die Kurven. Rückwärts knickt er schnell ein.'},
};
const totLen=V=>V.trailer?V.len-V.ro+V.trailer.from+V.trailer.len:V.len;

/* ---------- Schauplätze ---------- */
const THEMES={
  supermarkt:{name:'Supermarkt',ground:['#e6e3ea','#2b2931'],line:['#ffffff','#7c7686'],flank:'wall'},
  busbahnhof:{name:'Busbahnhof',ground:['#e3e7ec','#272a30'],line:['#fff3c4','#8a7f55'],flank:'wall'},
  wohn:{name:'Wohnstraße',ground:['#dedbe2','#2a2830'],line:['#ffffff','#7c7686'],flank:'wall'},
  stadt:{name:'Altstadt',ground:['#dedbe2','#2a2830'],line:['#ffffff','#7c7686'],flank:'wall'},
  hof:{name:'Bauernhof',ground:['#e3eccb','#232b22'],line:['#fffdf5','#77806a'],flank:'bale',scatter:['bale','roundbale','trough']},
  baustelle:{name:'Baustelle',ground:['#eee0c2','#2c271f'],line:['#f08a5d','#b26a45'],flank:'barrier',scatter:['cone','cone','pile','pallet']},
  hafen:{name:'Hafen',ground:['#e2e6ea','#22262b'],line:['#fff3c4','#8a7f55'],flank:'container',scatter:['barrel','pallet','cone']},
  kaserne:{name:'Kaserne',ground:['#e4e6d0','#25281f'],line:['#fffdf5','#77806a'],flank:'sandbag',scatter:['crate','barrel','hedgehog']},
};
// Fünf Stufen mit je sechs Szenarien, jede Partie zieht pro Stufe eines.
// mw/ml = Luft in der Lücke quer/längs (Anteil der Fahrzeuggröße) · dir = verlangte Parkrichtung
// course = Hindernisse auf dem Weg · far = Lücke in der hinteren Fahrgasse · narrow = Baustelle · wohn = Wohnstraße · side = Seitenstraße zum Wenden
const LEVELS=[
  [ // Stufe 1: Platz genug, Richtung egal
    {veh:'pkw',tpl:'lot',theme:'supermarkt',mw:.85,ml:.4,time:45},
    {veh:'traktor',tpl:'yard',theme:'hof',pos:'right',mw:.9,ml:.5,clutter:2,time:50},
    {veh:'pkw',tpl:'street',theme:'stadt',mw:.35,ml:.8,time:45},
    {veh:'bagger',tpl:'yard',theme:'baustelle',pos:'top',mw:.65,ml:.4,clutter:3,time:55},
    {veh:'traktor',tpl:'lot',theme:'hof',mw:.55,ml:.35,time:50},
    {veh:'panzer',tpl:'yard',theme:'kaserne',pos:'diag',mw:.45,ml:.35,clutter:3,time:55},
  ],
  [ // Stufe 2: erste Vorgaben und Hindernisse
    {veh:'pkw',tpl:'lot',theme:'supermarkt',mw:.42,ml:.25,dir:'rück',time:50},
    {veh:'bus',tpl:'lot',theme:'busbahnhof',mw:.45,ml:.18,dir:'vor',time:60},
    {veh:'lkw',tpl:'yard',theme:'hafen',pos:'right',mw:.5,ml:.25,course:'chicane',gap:3.2,time:70},
    {veh:'pkw',tpl:'street',theme:'stadt',mw:.3,ml:.5,top:1,time:50},
    {veh:'pkw',tpl:'street',theme:'wohn',wohn:1,mw:.3,ml:.55,time:55},
    {veh:'traktor',tpl:'yard',theme:'hof',pos:'right',mw:.5,ml:.3,course:'slalom',gap:2.5,time:80},
    {veh:'panzer',tpl:'yard',theme:'kaserne',pos:'diag',mw:.3,ml:.25,course:'tor',gap:1.8,dir:'rück',time:80},
  ],
  [ // Stufe 3: eng, mit Wenden und Rückwärtsfahren
    {veh:'bus',tpl:'lot',theme:'busbahnhof',mw:.36,ml:.14,dir:'rück',time:75},
    {veh:'pkw',tpl:'street',theme:'stadt',mw:.3,ml:.42,top:1,dir:'wende',time:65},
    {veh:'bagger',tpl:'lot',theme:'baustelle',mw:.4,ml:.22,dir:'rück',far:1,time:90},
    {veh:'pkw',tpl:'street',theme:'wohn',wohn:1,mw:.25,ml:.4,time:65},
    {veh:'lkw',tpl:'yard',theme:'hafen',pos:'right',mw:.4,ml:.2,course:'chicane',gap:2.7,dir:'rück',time:90},
    {veh:'panzer',tpl:'yard',theme:'kaserne',pos:'right',mw:.25,ml:.2,course:'slalom',gap:1.7,dir:'rück',time:120},
    {veh:'pkw',tpl:'court',theme:'stadt',mw:.35,ml:.4,size:[3.6,2.6],cars:2,time:60},
  ],
  [ // Stufe 4: sperrige Fahrzeuge auf engem Raum
    {veh:'bus',tpl:'court',theme:'busbahnhof',mw:.4,ml:.2,size:[2.5,1.75],time:110},
    {veh:'lkwh',tpl:'yard',theme:'hafen',pos:'right',mw:.4,ml:.15,course:'tor',gap:2.6,dir:'vor',time:110},
    {veh:'pkw',tpl:'street',theme:'stadt',mw:.25,ml:.32,top:1,narrow:.38,time:70},
    {veh:'traktor',tpl:'lot',theme:'hof',mw:.3,ml:.2,dir:'rück',far:1,time:80},
    {veh:'lkw',tpl:'street',theme:'wohn',wohn:1,mw:.2,ml:.36,time:100},
    {veh:'lkw',tpl:'street',theme:'stadt',mw:.25,ml:.36,top:1,time:95},
    {veh:'bagger',tpl:'yard',theme:'baustelle',pos:'right',mw:.3,ml:.2,course:'slalom',gap:2,dir:'rück',time:115},
  ],
  [ // Stufe 5: Meisterprüfung
    {veh:'lkwh',tpl:'yard',theme:'hafen',pos:'left',mw:.55,ml:.15,dir:'rück',time:150},
    {veh:'bus',tpl:'court',theme:'busbahnhof',mw:.32,ml:.16,size:[2.3,1.6],quer:1,time:130},
    {veh:'bus',tpl:'street',theme:'stadt',mw:.25,ml:.34,dir:'wende',side:2.6,time:140},
    {veh:'panzer',tpl:'lot',theme:'kaserne',mw:.2,ml:.15,dir:'rück',far:1,time:110},
    {veh:'pkw',tpl:'street',theme:'wohn',wohn:1,mw:.22,ml:.4,dir:'wende',side:1.9,time:100},
    {veh:'lkw',tpl:'court',theme:'hafen',mw:.3,ml:.16,size:[2.4,1.7],cars:1,time:130},
    {veh:'pkw',tpl:'street',theme:'stadt',mw:.22,ml:.32,top:1,narrow:.38,dir:'wende',side:1.8,time:90},
  ],
];
const PARKCOL=['rose','sea','water','violet','apricot','amber','lime','steel'];
const vorgabe=d=>d.tpl==='court'?(d.quer?'wenden und rückwärts einparken':'wenden, Front in Pfeilrichtung'):d.dir?DIRTXT[d.dir]:'';
const DIRTXT={vor:'vorwärts einparken',rück:'rückwärts einparken',wende:'vorher wenden: Front in Pfeilrichtung'};

function build(def,R){
  const V=VEH[def.veh],TL=totLen(V),sl=TL*(1+def.ml),sw=V.wid*(1+def.mw),TH=24;
  const S={def,V,obs:[],lines:[],decor:[],theme:THEMES[def.theme],limit:def.time};
  const rear=V.trailer?V.trailer.from+V.trailer.len:V.ro,sx=rear+44,front=sx+V.len-V.ro; // Heck steht 44 px vom linken Rand
  const rect=(cx,cy,hw,hh,a,kind,ex)=>{const o={t:'r',cx,cy,hw,hh,a,kind,...ex};S.obs.push(o);return o;};
  const wall=(x1,y1,x2,y2,kind)=>rect((x1+x2)/2,(y1+y2)/2,Math.abs(x2-x1)/2,Math.abs(y2-y1)/2,0,kind||S.theme.flank);
  const circ=(x,y,r,kind)=>S.obs.push({t:'c',x,y,r,kind});
  const parked=(cx,cy,a,vt)=>{const P=VEH[vt],tl=totLen(P);rect(cx,cy,tl/2,P.wid/2,a,'veh',{vt,col:R.pick(PARKCOL)});};
  const need=a=>def.dir==='rück'?a+PI:def.dir==='vor'?a:null;
  if(def.tpl==='lot'){ // Parkplatz in echten Maßen: Fahrgasse nur gut eine Fahrzeuglänge breit
    const aw=Math.max((def.aisle||1.45)*TL,TL+V.wid),pv=def.veh==='lkwh'?'lkw':def.veh,jit=(sw-V.wid)*.22,conn=Math.max(aw,TL*1.15+V.wid);
    const rows=[{y:0,a:-PI/2,x1:40,x2:FW-40,aisle:0}];let y=sl+aw,aisles=[sl+aw/2];
    if(FH-y>=2*sl+aw+16){rows.push({y,a:PI/2,x1:conn,x2:FW-conn,aisle:0},{y:y+sl,a:-PI/2,x1:conn,x2:FW-conn,aisle:1});y+=2*sl+aw;aisles.push(y-aw/2);}
    else if(FH-y>=sl+6){rows.push({y,a:PI/2,x1:40,x2:FW-40,aisle:0});y+=sl;}
    if(FH-y>14)wall(0,y,FW,FH,'planter');
    // Ziel: nah = an der Startgasse, far = in der hinteren Gasse (um die Mittelreihe herum)
    const sa=aisles.length-1,cand=rows.filter(r=>aisles.length<2||(def.far?r.aisle===0:r.aisle===sa)),trow=R.pick(cand);
    rows.forEach(r=>{const n=Math.floor((r.x2-r.x1)/sw),x0=(r.x1+r.x2-n*sw)/2,cy=r.y+sl/2,ti=r===trow?R.int(Math.floor(n*.35),Math.max(1,n-3)):-9;
      for(let i=0;i<=n;i++)S.lines.push([x0+i*sw,r.y,x0+i*sw,r.y+sl]);
      if(rows.some(q=>q.y===r.y+sl))S.lines.push([x0,r.y+sl,x0+n*sw,r.y+sl]);
      for(let i=0;i<n;i++){const cx=x0+(i+.5)*sw;
        if(i===ti){S.slot={cx,cy,hw:sl/2,hh:sw/2,a:r.a,need:need(r.a)};continue;}
        if(Math.abs(i-ti)===1&&def.mw<.8||R()<.8)parked(cx+R.range(-jit,jit),cy+R.range(-1,1)*(sl-TL)*.25,R()<.5?r.a:r.a+PI,pv);}
    });
    S.start={x:sx,y:aisles[sa],a:0};
  }else if(def.tpl==='street'){ // Straße in echten Maßen: Fahrstreifen höchstens zwei Autobreiten
    const wohn=def.wohn,LW=wohn?92:72,TS=wohn?44:50,pw=Math.max(sw,TS),lanes=wohn?1:2,roadH=TS+lanes*LW+pw,y1=Math.round((FH-roadH)/2),y2=y1+roadH,cy=y2-pw/2;
    const cx=R.range(660,820),sideW=def.side?def.side*LW:0,sideX=def.side?front+90+sideW/2+R.range(0,60):-999;
    if(def.side){rect((sideX-sideW/2)/2,y1/2,(sideX-sideW/2)/2,y1/2,0,'curb');const xr=sideX+sideW/2;rect((xr+FW)/2,y1/2,(FW-xr)/2,y1/2,0,'curb');}
    else rect(FW/2,y1/2,FW/2,y1/2,0,'curb');
    rect(FW/2,(y2+FH)/2,FW/2,(FH-y2)/2,0,'curb');
    if(!wohn)S.decor.push({k:'lane',y:y1+TS+LW});
    S.lines.push([0,y2-pw,FW,y2-pw,1],[0,y1+TS,FW,y1+TS,1]);
    S.slot={cx,cy,hw:sl/2,hh:pw/2,a:0,need:def.dir==='wende'?PI:null};
    const bins=(x,yy)=>{if(wohn||R()<.3){circ(x-9,yy,8,'bin');circ(x+9,yy,8,'bin');}};
    const strip=(x,dir,stop)=>{for(let k=0;dir<0?x>stop:x<stop;k++){const g=R.range(7,14),l=84;
        if(k===0||R()>(wohn?.2:.12))parked(x+dir*l/2,cy+R.range(-3,3),R()<.85?0:PI,'pkw');else{if(wohn)S.decor.push({k:'drive',x:x+dir*l/2,y:y2,w:l-14,up:0});bins(x+dir*(l-16),y2-11);}
        x+=dir*(l+g);}};
    strip(cx-sl/2-R.range(5,9),-1,70);strip(cx+sl/2+R.range(5,9),1,FW-90);
    const blk=def.narrow?sl*.9+70:0,dens=def.top?.85:wohn?.8:.45;
    for(let x=R.range(60,120);x<FW-60;x+=84+R.range(7,14)){
      if(Math.abs(x-sideX)<sideW/2+70||Math.abs(x-cx)<blk)continue;
      if(R()<dens)parked(x,y1+TS/2+R.range(-2,2),R()<.85?PI:0,'pkw');else if(wohn){S.decor.push({k:'drive',x,y:y1,w:70,up:1});bins(x+34,y1+11);}}
    if(def.narrow){const nh=TS+LW*def.narrow*2;wall(cx-sl*.9,y1,cx+sl*.9,y1+nh,'barrier');for(const k of[-1,1])circ(cx+k*(sl*.9+20),y1+nh-10,11,'cone');}
    // Häuser, Vorgärten und Bäume hinter dem Gehweg
    for(const up of[1,0]){const d0=up?y1-34:FH-y2-34;if(d0<70)continue;
      for(let x=R.range(10,60);x<FW-100;){const w=R.range(120,190),h=Math.min(d0-22,R.range(80,130));
        if(!(up&&x<sideX+sideW/2+10&&x+w>sideX-sideW/2-10))S.decor.push({k:'house',x,y:up?y1-34-12-h:y2+34+12,w,h,c:R.int(0,5),up});
        if(R()<.6)S.decor.push({k:'tree',x:x+w+22,y:up?y1-34-R.range(30,d0-30):y2+34+R.range(30,d0-30),r:R.range(16,24)});
        x+=w+R.range(40,90);}}
    S.start={x:sx,y:wohn?y1+TS+LW/2:y1+TS+LW*1.5,a:0};
  }else if(def.tpl==='court'){ // enger Hof: erst wenden, dann einparken
    const cw=Math.min(FW-40,def.size[0]*TL),ch=Math.min(FH-30,def.size[1]*TL),x0=(FW-cw)/2,y0=(FH-ch)/2,x1=x0+cw,y1=y0+ch;
    wall(0,0,FW,y0,'block');wall(0,y1,FW,FH,'block');wall(0,y0,x0,y1,'block');wall(x1,y0,FW,y1,'block');
    if(def.quer){const cx=x1-14-sw/2,cy=y0+sl/2+8;S.slot={cx,cy,hw:sl/2,hh:sw/2,a:-PI/2,need:PI/2};S.lines.push([cx-sw/2,y0,cx-sw/2,y0+sl+8]);}
    else{const cx=x0+12+sl/2,cy=y0+10+sw/2;S.slot={cx,cy,hw:sl/2,hh:sw/2,a:0,need:PI};S.lines.push([x0,cy+sw/2,cx+sl/2,cy+sw/2],[cx+sl/2,y0,cx+sl/2,cy+sw/2]);}
    for(let k=0;k<(def.cars||0);k++)parked(x1-30-(k*.9+.5)*60,y1-52,PI/2*(R()<.5?1:-1),'pkw');
    S.start={x:x0+rear+16,y:y1-V.wid/2-16,a:0};
  }else{ // freier Platz mit einer Bucht, davor je nach Szenario ein Parcours
    let cx,cy,a,sy;
    const same=def.course==='chicane'; // nach zwei Wänden kommt man auf der Startseite heraus
    if(def.pos==='right'){const up=R()<.5;cy=up?70+sw/2:FH-70-sw/2;cx=FW-50-sl/2;a=0;sy=up!==same?FH-110:110;}
    else if(def.pos==='left'){const up=R()<.5;cy=up?70+sw/2:FH-70-sw/2;cx=64+sl/2;a=PI;sy=up?FH-110:110;} // Bucht neben dem Start, Einfahrt von rechts
    else if(def.pos==='top'){cx=R.range(720,1000);cy=40+sl/2;a=-PI/2;sy=FH-150;}
    else{a=-PI/4;cx=FW-110-sl*.36-sw*.36;cy=110+sl*.36+sw*.36;sy=FH-140;}
    S.slot={cx,cy,hw:sl/2,hh:sw/2,a,need:need(a)};
    const c=Math.cos(a),s=Math.sin(a),fk=S.theme.flank;
    [-1,1].forEach(k=>rect(cx-s*k*(sw/2+14),cy+c*k*(sw/2+14),sl/2,14,a,fk));
    rect(cx+c*(sl/2+14),cy+s*(sl/2+14),14,sw/2+28,a,fk);
    S.start={x:sx,y:sy,a:0};
    const low=sy>FH/2,g=(def.gap||2.5)*V.wid,xa=front+Math.max(110,V.wid*2),xe=cx-sl/2-Math.max(TL*1.1,170);
    if(def.course==='chicane'||def.course==='slalom'){ // versetzte Wände: Lücke abwechselnd oben und unten
      const nW=def.course==='slalom'?3:2;
      for(let k=0;k<nW;k++){const x=xa+(xe-xa)*(nW===1?0:k/(nW-1)),top=(k%2===0)===low; // erste Lücke gegenüber vom Start
        if(top)wall(x,g,x+TH,FH);else wall(x,0,x+TH,FH-g);}
    }else if(def.course==='tor'){const x=(xa+xe)/2,gy=low?R.range(70,FH*.3):R.range(FH*.7,FH-70)-g;wall(x,0,x+TH,gy);wall(x,gy+g,x+TH,FH);for(const yy of[gy-2,gy+g+2])circ(x-18,yy,11,'cone');}
    // lose Hindernisse, aber nicht im Startbereich und nicht direkt vor der Einfahrt
    const ex=cx-c*(sl/2),ey=cy-s*(sl/2),pts=[],minGap=V.wid*2.2+TL*.35;
    for(let i=0,tries=0;i<(def.clutter||0)&&tries<400;tries++){
      const x=R.range(260,FW-80),y=R.range(60,FH-60);
      if(Math.hypot(x-S.start.x,y-S.start.y)<TL+140)continue;
      if(Math.abs(y-S.start.y)<V.wid+50&&x<S.start.x+TL+260)continue;
      let near=false;for(let k=-sl/2;k<=TL*1.3+120;k+=30)if(Math.hypot(x-(ex-c*k),y-(ey-s*k))<V.wid*1.6+60){near=true;break;}
      if(near||pts.some(p=>Math.hypot(p[0]-x,p[1]-y)<minGap))continue;
      pts.push([x,y]);i++;const kind=R.pick(S.theme.scatter);
      if(kind==='cone')circ(x,y,11,kind);else if(kind==='barrel')circ(x,y,16,kind);else if(kind==='roundbale')circ(x,y,24,kind);else if(kind==='pile')circ(x,y,30,kind);else if(kind==='hedgehog')circ(x,y,18,kind);
      else if(kind==='trough')rect(x,y,40,14,R.pick([0,PI/2]),kind);else rect(x,y,24,24,R.range(-.3,.3),kind);
    }
  }
  S.startDist=Math.hypot(S.start.x-S.slot.cx,S.start.y-S.slot.cy);
  return S;
}

/* ---------- Geometrie ---------- */
function corners(o){const c=Math.cos(o.a),s=Math.sin(o.a);return[[1,1],[1,-1],[-1,-1],[-1,1]].map(([i,j])=>[o.cx+c*o.hw*i-s*o.hh*j,o.cy+s*o.hw*i+c*o.hh*j]);}
function satHit(A,B){
  const ca=corners(A),cb=corners(B);
  for(const o of[A,B])for(const ang of[o.a,o.a+PI/2]){const ax=Math.cos(ang),ay=Math.sin(ang);let a0=1e9,a1=-1e9,b0=1e9,b1=-1e9;
    for(const p of ca){const d=p[0]*ax+p[1]*ay;if(d<a0)a0=d;if(d>a1)a1=d;}for(const p of cb){const d=p[0]*ax+p[1]*ay;if(d<b0)b0=d;if(d>b1)b1=d;}
    if(a1<b0||b1<a0)return false;}
  return true;
}
function circHit(B,o){const c=Math.cos(B.a),s=Math.sin(B.a),dx=o.x-B.cx,dy=o.y-B.cy,lx=dx*c+dy*s,ly=-dx*s+dy*c,px=clamp(lx,-B.hw,B.hw),py=clamp(ly,-B.hh,B.hh);return Math.hypot(lx-px,ly-py)<o.r;}
function inBox(B,x,y){const c=Math.cos(B.a),s=Math.sin(B.a),dx=x-B.cx,dy=y-B.cy;return Math.abs(dx*c+dy*s)<=B.hw+.01&&Math.abs(-dx*s+dy*c)<=B.hh+.01;}

/* ---------- Zustand ---------- */
let seed,LV=[],li=0,S=null,car=null,state='idle',tLeft=0,started=false,crashes=0,total=0,results=[],freeze=0,parkT=0,pct=0,hintT=0,beep=0,wrongCd=0;
const keys={};
function parts(c=car){ // Karosserie(n) als gedrehte Rechtecke
  const V=S.V,d=V.len/2-V.ro,out=[{cx:c.x+Math.cos(c.a)*d,cy:c.y+Math.sin(c.a)*d,hw:V.len/2,hh:V.wid/2,a:c.a}];
  if(V.trailer){const T=V.trailer,k=T.from+T.len/2;out.push({cx:c.x-Math.cos(c.ta)*k,cy:c.y-Math.sin(c.ta)*k,hw:T.len/2,hh:T.wid/2,a:c.ta});}
  return out;
}
function percentIn(){let n=0,m=0;for(const B of parts()){const c=Math.cos(B.a),s=Math.sin(B.a);for(let i=0;i<=10;i++)for(let j=0;j<=4;j++){const lx=(i/5-1)*B.hw,ly=(j/2-1)*B.hh;m++;if(inBox(S.slot,B.cx+lx*c-ly*s,B.cy+lx*s+ly*c))n++;}}return n/m;}
function collides(){
  for(const B of parts()){
    for(const p of corners(B))if(p[0]<0||p[1]<0||p[0]>FW||p[1]>FH)return'Rand';
    for(const o of S.obs)if(o.t==='c'?circHit(B,o):satHit(B,o))return o.kind;
  }
  if(S.V.trailer&&Math.abs(angd(car.a,car.ta))>1.35)return'knick';
  return null;
}
const angd=(a,b)=>{let d=a-b;while(d>PI)d-=2*PI;while(d<-PI)d+=2*PI;return d;};
function resetCar(){car={x:S.start.x,y:S.start.y,a:S.start.a,ta:S.start.a,v:0,st:0};parkT=0;}
function newGame(){seed=GG.newSeed();const R=GG.rng(seed);LV=LEVELS.map(p=>R.pick(p));total=0;results=[];setup(0);showStart();}
function setup(i){li=i;S=build(LV[i],GG.rng(seed+i*7919+3));resetCar();tLeft=S.limit;started=false;crashes=0;state='idle';pct=0;freeze=0;}
function begin(){ov.hide();state='drive';hintT=7;}

function update(dt){
  if(state!=='drive')return;
  hintT=Math.max(0,hintT-dt);
  if(started){tLeft-=dt;if(tLeft<=0){tLeft=0;return finish(false);}}
  if(freeze>0){freeze-=dt;if(freeze<=0)resetCar();return;}
  const V=S.V,up=keys.w||keys.arrowup,dn=keys.s||keys.arrowdown,lf=keys.a||keys.arrowleft,rt=keys.d||keys.arrowright,hb=keys[' '];
  if(up||dn||lf||rt)started=true;
  // Gas, Bremse, Rückwärtsgang
  if(hb)car.v-=Math.sign(car.v)*Math.min(Math.abs(car.v),520*dt);
  else if(up)car.v=car.v<0?Math.min(0,car.v+V.acc*2.4*dt):Math.min(V.maxV,car.v+V.acc*dt);
  else if(dn)car.v=car.v>0?Math.max(0,car.v-V.acc*2.4*dt):Math.max(-V.rev,car.v-V.acc*.8*dt);
  else car.v-=Math.sign(car.v)*Math.min(Math.abs(car.v),90*dt);
  const want=(rt?1:0)-(lf?1:0);
  if(V.kind==='tank'){car.st=want;car.a+=want*V.turn*dt*(Math.abs(car.v)>40?.8:1);}
  else{const tgt=want*V.steer,d=tgt-car.st,rate=(want?V.sr:V.sr*1.6)*dt;car.st+=clamp(d,-rate,rate);car.a+=car.v/V.L*Math.tan(car.st)*dt;}
  car.x+=Math.cos(car.a)*car.v*dt;car.y+=Math.sin(car.a)*car.v*dt;
  if(V.trailer)car.ta+=car.v/V.trailer.Lt*Math.sin(angd(car.a,car.ta))*dt;
  // Rückfahrwarner bei den Großen
  if(car.v<-8&&(V.len>150||V.trailer)){beep-=dt;if(beep<=0){beep=.55;GG.tone(1250,.12,'square',.03);}}
  const hit=collides();
  if(hit){crashes++;freeze=.9;car.v=0;GG.sfx('err');GG.toast(hit==='knick'?'Hänger eingeknickt! Zurück zum Start':hit==='Rand'?'Platz verlassen! Zurück zum Start':'Angeeckt! Zurück zum Start',COL.rose);return;}
  pct=percentIn();
  const wrong=S.slot.need!=null&&Math.abs(angd(car.a,S.slot.need))>1.2;wrongCd-=dt;
  if(pct>=1&&Math.abs(car.v)<10){if(wrong){parkT=0;if(wrongCd<=0){wrongCd=3;GG.toast('Falsch herum! Die Front muss in Pfeilrichtung zeigen',COL.amber);}}else{parkT+=dt;if(parkT>=.7)finish(true);}}else parkT=0;
}
function finish(ok){
  state='done';
  let pts,detail;const used=S.limit-tLeft;
  if(ok){const bonus=Math.round(1000*tLeft/S.limit);pts=1000+bonus;detail=[['Eingeparkt','1.000'],[`Zeitbonus (${used.toFixed(1)} s von ${S.limit} s)`,`+${GG.num(bonus)}`]];GG.sfx('win');}
  else{pct=freeze>0?0:percentIn();if(pct>=1)pct=.9; // ganz drin, aber falsch herum

    if(pct>0){pts=Math.round(300+500*pct);detail=[[`${Math.round(pct*100)} % des Fahrzeugs in der Lücke`,GG.num(pts)]];}
    else{const d=Math.hypot(car.x-S.slot.cx,car.y-S.slot.cy),f=freeze>0?0:clamp(1-d/S.startDist,0,1);pts=Math.round(300*f);detail=[[`Nähe zur Lücke (${Math.round(f*100)} % des Wegs)`,GG.num(pts)]];}
    GG.sfx('thud');}
  total+=pts;results.push({ok,pts,veh:S.V.name,theme:S.theme.name,used,crashes,pct});
  setTimeout(()=>showSummary(ok,pts,detail),ok?700:300);
}

  const sl=S.slot,ok=pct>=1;c.save();c.translate(sl.cx,sl.cy);c.rotate(sl.a);
  c.fillStyle=ok?COL.sea:COL.water;c.globalAlpha=.25+.35*pct+(ok?.15*Math.sin(performance.now()/120):0);c.fillRect(-sl.hw,-sl.hh,sl.hw*2,sl.hh*2);c.globalAlpha=1;
  c.strokeStyle=ok?COL.seaInk:COL.waterInk;c.lineWidth=4;c.setLineDash([16,10]);c.lineDashOffset=-performance.now()/50;c.strokeRect(-sl.hw,-sl.hh,sl.hw*2,sl.hh*2);c.setLineDash([]);
  if(sl.need!=null){const d=Math.cos(sl.need-sl.a)>0?1:-1,L=Math.min(sl.hw*.7,90),w=Math.min(sl.hh*.5,16);c.fillStyle=ok?COL.seaInk:COL.waterInk;c.globalAlpha=.8;
    c.beginPath();c.moveTo(d*(sl.hw-12),0);c.lineTo(d*(sl.hw-12-w*1.6),-w);c.lineTo(d*(sl.hw-12-w*1.6),-w*.4);c.lineTo(d*(sl.hw-12-L),-w*.4);c.lineTo(d*(sl.hw-12-L),w*.4);c.lineTo(d*(sl.hw-12-w*1.6),w*.4);c.lineTo(d*(sl.hw-12-w*1.6),w);c.closePath();c.fill();c.globalAlpha=1;c.translate(-d*sl.hw*.45,0);}
  c.rotate(-sl.a);c.font=`800 ${Math.min(44,sl.hh*1.4)}px ${DISPLAY}`;c.textAlign='center';c.textBaseline='middle';c.fillStyle=ok?COL.seaInk:COL.waterInk;c.globalAlpha=.75;c.fillText('P',0,2);c.globalAlpha=1;c.textBaseline='alphabetic';c.restore();
  S.obs.forEach(o=>{if(o.kind==='curb')drawObs(o);});
  S.decor.forEach(d=>{const HC=[COL.rose,COL.apricot,COL.amber,COL.water,COL.violet,COL.sea];
    if(d.k==='drive'){c.fillStyle=DARK?'#3a363f':'#e2ddd6';c.fillRect(d.x-d.w/2,d.up?d.y-46:d.y,d.w,46);c.strokeStyle=COL.amberInk;c.globalAlpha=.55;c.lineWidth=2;for(let k=-d.w/2+6;k<d.w/2-4;k+=12){c.beginPath();c.moveTo(d.x+k,d.up?d.y+4:d.y-4);c.lineTo(d.x+k+8,d.up?d.y+16:d.y-16);c.stroke();}c.globalAlpha=1;}
    if(d.k==='house'){c.fillStyle=DARK?'#3a4a3e':'#cfe6c0';GG.rr(c,d.x-8,d.y-8,d.w+16,d.h+16,8);c.fill();c.fillStyle=HC[d.c];c.strokeStyle=OUT;c.lineWidth=2;GG.rr(c,d.x+10,d.y+6,d.w-20,d.h-12,5);c.fill();c.stroke();
      c.beginPath();c.moveTo(d.x+10,d.y+d.h/2);c.lineTo(d.x+d.w-10,d.y+d.h/2);c.stroke();c.fillStyle=DARK?'rgba(0,0,0,.2)':'rgba(255,255,255,.35)';c.fillRect(d.x+12,d.y+8,d.w-24,d.h/2-8);
      c.fillStyle=DARK?'#58525e':'#e9e2d6';c.fillRect(d.x+d.w/2-7,d.up?d.y+d.h-6:d.y-14,14,20);}});
  S.decor.forEach(d=>{if(d.k==='tree'){c.fillStyle=DARK?'#4f7d5c':'#a9d8b0';c.strokeStyle=DARK?'#36573f':'#79b58a';c.lineWidth=2.5;c.beginPath();c.arc(d.x,d.y,d.r,0,7);c.fill();c.stroke();c.fillStyle=DARK?'#6a9a76':'#c8e8cb';c.beginPath();c.arc(d.x-d.r*.25,d.y-d.r*.25,d.r*.35,0,7);c.fill();}});
  S.obs.forEach(o=>{if(o.kind!=='curb')drawObs(o);});
  // Startfeld
  if(!started){c.strokeStyle=COL.muted;c.lineWidth=2;c.setLineDash([6,6]);const B=parts()[0];c.save();c.translate(B.cx,B.cy);c.rotate(B.a);c.strokeRect(-B.hw-8,-B.hh-8,B.hw*2+16,B.hh*2+16);c.restore();c.setLineDash([]);}
  const blink=freeze>0&&Math.floor(freeze*10)%2;
  if(!blink)drawVehicle(c,S.def.veh,car.x,car.y,car.a,S.V.col,car.st,car.ta,true);
  if(freeze>0){c.fillStyle=`rgba(226,85,124,${freeze*.25})`;c.fillRect(0,0,FW,FH);}
  if(hintT>0&&state==='drive'){c.globalAlpha=Math.min(1,hintT);c.font=`600 15px ${DISPLAY}`;const t=`${S.V.name}: ${S.V.hint}`+(vorgabe(S.def)?` Vorgabe: ${vorgabe(S.def)}.`:''),w=c.measureText(t).width+36;const hy=S.slot.cy<FH/2&&Math.abs(S.slot.cx-FW/2)<w/2+S.slot.hw+S.slot.hh?FH-56:14;GG.rr(c,FW/2-w/2,hy,w,36,18);c.fillStyle=COL.panel;c.fill();c.strokeStyle=COL.accent;c.lineWidth=1;c.stroke();GG.text(c,t,FW/2,hy+23,{size:15,weight:600,align:'center'});c.globalAlpha=1;}
  if(parkT>0){c.strokeStyle=COL.seaInk;c.lineWidth=6;c.beginPath();c.arc(sl.cx,sl.cy,26,-PI/2,-PI/2+2*PI*Math.min(1,parkT/.7));c.stroke();}
  c.restore();
  // Kopfleiste
  c.fillStyle=COL.panel;c.fillRect(0,0,W,TOP);c.strokeStyle=COL.edge;c.lineWidth=1;c.beginPath();c.moveTo(0,TOP+.5);c.lineTo(W,TOP+.5);c.stroke();
  GG.label(c,`STUFE ${li+1} / ${LV.length} · ${th.name.toUpperCase()}`,20,24,'left',COL.accentInk);GG.text(c,S.V.name,20,50,{size:22,weight:800});if(vorgabe(S.def)){const nw=c.measureText(S.V.name).width;GG.text(c,'↳ '+vorgabe(S.def),32+nw,49,{size:12,weight:600,font:MONO,color:COL.amberInk});}
  GG.label(c,'ZEIT',470,24);const f=tLeft/S.limit;GG.rr(c,470,34,220,12,6);c.fillStyle=COL.board;c.fill();if(f>0){GG.rr(c,470,34,Math.max(12,220*f),12,6);c.fillStyle=f<.25?COL.rose:COL.accent;c.fill();}
  GG.text(c,`${tLeft.toFixed(1)} s`,700,46,{size:15,weight:600,font:MONO,color:f<.25?COL.roseInk:COL.ink});
  if(!started&&state==='drive')GG.text(c,'Die Zeit läuft ab der ersten Taste',470,60,{size:11,font:MONO,color:COL.muted});
  GG.label(c,'IN DER LÜCKE',800,24);GG.value(c,`${Math.round(pct*100)} %`,800,52,'left',pct>=1?COL.seaInk:COL.ink,24);
  GG.label(c,'ANGEECKT',930,24);GG.value(c,String(crashes),930,52,'left',crashes?COL.roseInk:COL.ink,24);
  GG.label(c,'TEMPO',1030,24);GG.value(c,`${car.v<-1?'R':car.v>1?'V':'–'} ${Math.round(Math.abs(car.v)/6)}`,1030,52,'left',COL.ink,24);
  GG.label(c,'PUNKTE',W-20,24,'right');GG.value(c,GG.num(total),W-20,52,'right',COL.accentInk,24);
  GG.drawToast(c,W/2,TOP+86,dt);
}
GG.loop(draw);

/* ---------- Eingabe ---------- */
const GK=['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright',' '];
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(state!=='drive')return;if(GK.includes(k))e.preventDefault();keys[k]=true;
  if(k==='enter'&&started&&!e.repeat){e.preventDefault();finish(false);}});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});

/* ---------- Karten ---------- */
const TPL={lot:'Querparken',street:'Längsparken',court:'enger Hof',yard:'Parkbucht'},CRS={chicane:'einer Schikane',slalom:'einem Slalom',tor:'einem schmalen Tor'};
const lvText=d=>`<strong>${VEH[d.veh].name}</strong> · ${THEMES[d.theme].name} · ${TPL[d.tpl]}${d.course?' hinter '+CRS[d.course]:''}${d.far?' in der hinteren Fahrgasse':''}${d.wohn?' zwischen Einfahrten und Mülltonnen':''}${d.narrow?' an einer Baustelle':''} · ${d.time} Sekunden.${vorgabe(d)?` <strong>Vorgabe: ${vorgabe(d)}.</strong>`:''} ${VEH[d.veh].hint}`;
function showStart(){
  ov.show(`<div class="eyebrow">Minispiel · Geschick</div><h2>Parklücke</h2>
    <p>Fünf Stufen, jede deutlich schwerer: engere Lücken, Schikanen auf dem Weg, sperrige Fahrzeuge, Wenden auf engem Raum.</p>
    <ul><li>Stell das Fahrzeug ganz in die markierte Lücke und bleib stehen. Das bringt 1.000 Punkte plus bis zu 1.000 für die Zeit.</li>
    <li>Zeigt die Lücke einen Pfeil, muss die Front am Ende in Pfeilrichtung stehen, zum Beispiel beim Rückwärtseinparken.</li>
    <li>Wer aneckt, startet wieder am Anfang. Die Zeit läuft weiter.</li>
    <li>Zeit um? Dann zählt, wie viel vom Fahrzeug schon drin ist oder wie nah du dran bist.</li></ul>
    <div class="next">Stufe 1 · ${lvText(LV[0])}</div>
    <button class="go" type="button">Stufe 1 starten</button>`,begin);
}
function showSummary(ok,pts,detail){
  const last=li>=LV.length-1,nx=LV[li+1];
  if(last)GG.report(total);
  ov.show(`<div class="eyebrow">Stufe ${li+1} · ${S.V.name}</div><h2>${ok?(crashes?'Eingeparkt!':'Sauber eingeparkt!'):'Zeit abgelaufen'}</h2>
    ${GG.rowsHtml([...detail,['Angeeckt',`${crashes}×`],['Stufe',`+${GG.num(pts)}`,'total'],['Gesamt',GG.num(total)]])}
    ${last?`<div class="big">${GG.num(total)}</div>${GG.rowsHtml(results.map((r,i)=>[`${i+1}. ${r.veh} · ${r.ok?`${r.used.toFixed(1)} s`:`${Math.round(r.pct*100)} % drin`}`,`+${GG.num(r.pts)}`]))}`:`<div class="next">Stufe ${li+2} · ${lvText(nx)}</div>`}
    <button class="go" type="button">${last?(GG.room?'Zurück zum Warteraum':'Nochmal'):`Stufe ${li+2} starten`}</button>`,last?(GG.room?GG.backToLobby:newGame):()=>{setup(li+1);begin();});
}
document.getElementById('restart').addEventListener('click',newGame);
newGame();
})();
