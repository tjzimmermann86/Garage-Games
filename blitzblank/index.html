];

];
const ZWEIG=['Besen, Schuhe, Mopp','Handsauger','Bodenstaubsauger','Saugroboter'];
const TOOLS=['besen','hand','boden','akku','mopp'],TNAME={besen:'Besen',hand:'Handsauger',boden:'Bodensauger',akku:'Akkusauger',mopp:'Wischmopp'};
let own={besen:1},money=0;
function stat(t){
  if(t==='besen')return{r:own.besen2?24:16,rate:1.3,carpet:.35,cap:Infinity,speed:1};
  if(t==='hand')return{r:15,rate:3.5,carpet:.6,cap:own.hand2?150:60,speed:1};

  if(t==='akku')return{r:24,rate:own.turbo?10:6,carpet:own.turbo?1:.7,cap:own.beutel?440:210,bat:own.akku2?80:40,speed:1.06};
  return{r:18,rate:own.dampf?3.2:1.3,carpet:1,cap:Infinity,speed:1,mop:true};
}
const sauger=t=>t==='hand'||t==='boden'||t==='akku';

/* ---------- Aufbau eines Hauses ---------- */
let seed,hi=0,S=null,state='idle',tLeft=0,started=false,total=0,results=[],P=null,tool='besen',fill={},bat=1,plug=null,robots=[],dog=null,earned=0,msgCd=0,sparks=[];
const keys={};
const dirtCv=document.createElement('canvas');dirtCv.width=W;dirtCv.height=GY*CS;const dctx=dirtCv.getContext('2d');
function build(def,R){
  const rooms=def.rooms.map(([kind,x,y,w,h])=>({kind,x,y,w,h,floor:(def.carpet||[]).includes(kind)?3:BODEN[kind]||1}));
  // Wände
  let walls=[];for(const r of rooms)walls.push({x:r.x-5,y:r.y-5,w:r.w+10,h:10},{x:r.x-5,y:r.y+r.h-5,w:r.w+10,h:10},{x:r.x-5,y:r.y-5,w:10,h:r.h+10},{x:r.x+r.w-5,y:r.y-5,w:10,h:r.h+10});
  const doors=[];
  for(const[a,b]of def.doors){const A=rooms[a],B=rooms[b],t=R.range(.3,.7);let d;
    if(Math.abs(A.x+A.w-B.x)<1||Math.abs(B.x+B.w-A.x)<1){const X=Math.abs(A.x+A.w-B.x)<1?B.x:A.x,y0=Math.max(A.y,B.y)+46,y1=Math.min(A.y+A.h,B.y+B.h)-46,cy=y0+(y1-y0)*t;d={x:X-9,y:cy-34,w:18,h:68,v:1};}
    else{const Y=Math.abs(A.y+A.h-B.y)<1?B.y:A.y,x0=Math.max(A.x,B.x)+46,x1=Math.min(A.x+A.w,B.x+B.w)-46,cx=x0+(x1-x0)*t;d={x:cx-34,y:Y-9,w:68,h:18,v:0};}
    doors.push(d);const out=[];
    for(const w of walls){const hit=w.x<d.x+d.w&&w.x+w.w>d.x&&w.y<d.y+d.h&&w.y+w.h>d.y,vert=w.h>w.w;
      if(!hit||vert!==!!d.v){out.push(w);continue;}
      if(vert){if(d.y-w.y>2)out.push({x:w.x,y:w.y,w:w.w,h:d.y-w.y});if(w.y+w.h-d.y-d.h>2)out.push({x:w.x,y:d.y+d.h,w:w.w,h:w.y+w.h-d.y-d.h});}
      else{if(d.x-w.x>2)out.push({x:w.x,y:w.y,w:d.x-w.x,h:w.h});if(w.x+w.w-d.x-d.w>2)out.push({x:d.x+d.w,y:w.y,w:w.x+w.w-d.x-d.w,h:w.h});}}
    walls=out;}
  // Möbel und Teppiche je Raumart
  const F=[],rugs=[],C=['rose','sea','water','violet','apricot','amber'];
  const add=(x,y,w,h,kind,low)=>F.push({x,y,w,h,kind,low:low&&!def.noLow?1:0,col:R.pick(C)});
  for(const r of rooms){const{x,y,w,h}=r,cx=x+w/2,cy=y+h/2;
    if(r.kind==='wohn'){const sw=Math.min(160,w*.5);add(cx-sw/2,y+12,sw,52,'sofa',1);rugs.push({x:cx-Math.min(100,w*.3),y:y+78,w:Math.min(200,w*.6),h:Math.min(110,h-150)});
      add(cx-34,y+96,68,36,'tisch',1);add(x+w-50,y+h*.34,38,Math.min(120,h*.4),'schrank');add(cx-58,y+h-38,116,26,'board');add(x+12,y+h-42,28,28,'pflanze');}
    else if(r.kind==='ess'){const tw=Math.min(160,w*.55),th=Math.min(80,h*.34);add(cx-tw/2,cy-th/2,tw,th,'esstisch');for(const[dx,dy]of[[-.3,-1],[.3,-1],[-.3,1],[.3,1]])add(cx+dx*tw-11,cy+dy*(th/2+16)-11,22,22,'stuhl');add(cx-52,y+10,104,26,'board');}
    else if(r.kind==='kueche'){add(x+12,y+12,w-24,38,'zeile');if(w>260&&h>200)add(cx-46,cy+6,92,42,'insel');add(x+12,y+h-44,34,32,'pflanze');}
    else if(r.kind==='schlaf'){add(x+12,cy-56,Math.min(150,w*.5),112,'bett',1);add(x+w-48,y+14,36,Math.min(130,h*.55),'schrank');rugs.push({x:x+Math.min(170,w*.56),y:cy-48,w:Math.min(86,w*.26),h:96});add(x+14,cy+62,28,28,'nacht');}
    else if(r.kind==='kind'){add(x+w-106,y+12,94,Math.min(150,h*.62),'bett',1);rugs.push({x:x+16,y:cy-40,w:Math.min(120,w*.45),h:Math.min(100,h*.45)});add(x+14,y+12,44,32,'kiste');add(x+16,y+h-46,Math.min(90,w*.35),34,'tischk');}
    else if(r.kind==='bad'){add(x+12,y+12,Math.min(62,w*.36),Math.min(136,h*.6),'wanne');add(x+w-48,y+14,36,44,'wc');add(x+w-64,y+h-40,52,28,'becken');}
    else if(r.kind==='buero'){const dw=Math.min(130,w*.6);add(cx-dw/2,y+12,dw,44,'tischk');add(cx-13,y+64,26,26,'stuhl');add(x+w-46,cy,34,Math.min(110,h*.42),'schrank');}
    else if(r.kind==='flur'){if(h>=86&&w>300)add(x+w*.6,y+8,96,22,'board');else if(w<=110)add(x+8,y+h*.72,22,84,'board');}}
  // nichts darf eine Tür zustellen
  const near=(f,d,m)=>f.x<d.x+d.w+m&&f.x+f.w>d.x-m&&f.y<d.y+d.h+m&&f.y+f.h>d.y-m;
  let furn=F.filter(f=>!doors.some(d=>near(f,d,40)));
  // Raster
  const N=GX*GY,floor=new Uint8Array(N),block=new Uint8Array(N),dirt=new Float32Array(N),kind=new Uint8Array(N),room=new Int8Array(N).fill(-1);
  const mark=()=>{block.fill(0);for(let j=0;j<GY;j++)for(let i=0;i<GX;i++){const k=j*GX+i,x=i*CS,y=j*CS,cx=x+CS/2,cy=y+CS/2;
      const ri=rooms.findIndex(r=>cx>=r.x&&cx<r.x+r.w&&cy>=r.y&&cy<r.y+r.h);room[k]=ri;floor[k]=ri<0?0:rugs.some(g=>cx>g.x&&cx<g.x+g.w&&cy>g.y&&cy<g.y+g.h)?3:rooms[ri].floor;
      const ov2=o=>x+2<o.x+o.w&&x+CS-2>o.x&&y+2<o.y+o.h&&y+CS-2>o.y;
      if(ri<0||walls.some(ov2)||furn.some(f=>!f.low&&ov2(f)))block[k]=1;else if(furn.some(f=>f.low&&cx>f.x&&cx<f.x+f.w&&cy>f.y&&cy<f.y+f.h))block[k]=2;}};
  mark();
  const flurR=rooms[0],kr=rooms.find(r=>r.kind==='kueche')||rooms[0];
  const freeNear=(px,py)=>{let b=-1,bd=1e9;for(let k=0;k<N;k++){if(block[k])continue;const d=Math.hypot((k%GX+.5)*CS-px,(Math.floor(k/GX)+.5)*CS-py);if(d<bd){bd=d;b=k;}}return{x:(b%GX+.5)*CS,y:(Math.floor(b/GX)+.5)*CS};};
  const dock=freeNear(flurR.x+30,flurR.y+flurR.h/2),start=freeNear(flurR.x+flurR.w/2,flurR.y+flurR.h/2),bin=freeNear(kr.x+kr.w-30,kr.y+kr.h-30);
  // jeder Raum muss erreichbar bleiben, sonst fliegen dort Möbel raus
  for(let guard=0;guard<6;guard++){const seen=reach(block,cellOf(start.x,start.y),c=>block[c]===0);const bad=rooms.findIndex((r,ri)=>{let ok=false,any=false;for(let k=0;k<N;k++)if(room[k]===ri&&block[k]===0){any=true;if(seen[k]){ok=true;break;}}return any&&!ok||!any;});
    if(bad<0)break;const r=rooms[bad];furn=furn.filter(f=>!(f.x+f.w/2>r.x&&f.x+f.w/2<r.x+r.w&&f.y+f.h/2>r.y&&f.y+f.h/2<r.y+r.h&&f.kind!=='zeile'&&f.kind!=='sofa'&&f.kind!=='bett'));mark();}
  // Schmutz: Staubnester, in Küche und Esszimmer Krümel, dazu Flecken
  const blobs=[];for(const r of rooms){const n=Math.max(1,Math.round(r.w*r.h/11000*def.dirt));for(let k=0;k<n;k++)blobs.push({x:R.range(r.x,r.x+r.w),y:R.range(r.y,r.y+r.h),r:R.range(40,110),s:R.range(.5,1.1)});}
  for(let k=0;k<N;k++){if(block[k]===1||!floor[k])continue;const cx=(k%GX+.5)*CS,cy=(Math.floor(k/GX)+.5)*CS;let v=0;for(const b of blobs){const d=Math.hypot(cx-b.x,cy-b.y);if(d<b.r*1.6)v+=b.s*Math.exp(-d*d/(b.r*b.r));}
    v=v*def.dirt+R()*.4*def.dirt-.14;if(block[k]===2)v*=.45;if(v>.08){dirt[k]=Math.min(1.3,v);const rk=rooms[room[k]].kind;kind[k]=rk==='kueche'||rk==='ess'?1:0;}}
  const sc=[];for(let k=0;k<N;k++)if(block[k]===0&&['kueche','ess','bad','flur','wohn'].includes(rooms[room[k]]?.kind))sc.push(k);
  for(let n=0;n<def.stains&&sc.length;n++){const k=R.pick(sc);for(const o of[0,1,GX,-1].slice(0,R.int(2,4))){const q=k+o;if(q>=0&&q<N&&block[q]===0){dirt[q]=3;kind[q]=2;}}}
  let tot=0,stainTot=0,underTot=0;for(let k=0;k<N;k++){tot+=dirt[k];if(kind[k]===2)stainTot+=dirt[k];else if(block[k]===2)underTot+=dirt[k];}
  const sockets=[];for(const r of rooms){if(r.kind==='flur'){const hz=r.w>r.h;sockets.push(hz?{x:r.x+r.w*.25,y:r.y+6}:{x:r.x+6,y:r.y+r.h*.25},hz?{x:r.x+r.w*.75,y:r.y+r.h-6}:{x:r.x+r.w-6,y:r.y+r.h*.75});}else sockets.push({x:r.x+r.w*.5,y:r.y+r.h<FH/2+40?r.y+6:r.y+r.h-6});}
  return{def,rooms,walls,doors,furn,rugs,floor,block,dirt,kind,room,N,dock,start,bin,sockets,total:tot,stainTot,underTot,added:0,eur:def.income/tot};
}
const cellOf=(x,y)=>clamp(Math.floor(y/CS),0,GY-1)*GX+clamp(Math.floor(x/CS),0,GX-1);
const cxy=k=>[(k%GX+.5)*CS,(Math.floor(k/GX)+.5)*CS];
// Breitensuche im Raster
function reach(block,from,pass){const seen=new Uint8Array(GX*GY),q=[from];seen[from]=1;for(let i=0;i<q.length;i++){const c=q[i],ci=c%GX,cj=(c-ci)/GX;for(const[di,dj]of[[1,0],[-1,0],[0,1],[0,-1]]){const a=ci+di,b=cj+dj;if(a<0||b<0||a>=GX||b>=GY)continue;const n=b*GX+a;if(seen[n]||!pass(n))continue;seen[n]=1;q.push(n);}}return seen;}
const prev=new Int32Array(GX*41);
function pathTo(from,pass,goal){const seen=new Uint8Array(GX*GY),q=[from];seen[from]=1;prev[from]=-1;
  for(let i=0;i<q.length;i++){const c=q[i];if(c!==from&&goal(c)){const out=[];for(let k=c;k!==from;k=prev[k])out.push(k);return out.reverse();}
    const ci=c%GX,cj=(c-ci)/GX;for(const[di,dj]of[[1,0],[-1,0],[0,1],[0,-1]]){const a=ci+di,b=cj+dj;if(a<0||b<0||a>=GX||b>=GY)continue;const n=b*GX+a;if(seen[n]||!pass(n))continue;seen[n]=1;prev[n]=c;q.push(n);}}
  return null;}
function wallBetween(x0,y0,x1,y1){for(const w of S.walls){let t0=0,t1=1,ok=true;const dx=x1-x0,dy=y1-y0;
    for(const[p,q]of[[-dx,x0-w.x],[dx,w.x+w.w-x0],[-dy,y0-w.y],[dy,w.y+w.h-y0]]){if(p===0){if(q<0){ok=false;break;}}else{const r=q/p;if(p<0){if(r>t1){ok=false;break;}if(r>t0)t0=r;}else{if(r<t0){ok=false;break;}if(r<t1)t1=r;}}}
    if(ok)return true;}return false;}

/* ---------- Schmutz zeichnen (pro Kästchen, nur bei Änderung) ---------- */
function paintCell(k){
  const x=(k%GX)*CS,y=Math.floor(k/GX)*CS,a=S.dirt[k];dctx.clearRect(x,y,CS,CS);if(a<=.02)return;
  const R=GG.rng(k*7919+13),under=S.block[k]===2;dctx.globalAlpha=under?.45:1;
  if(S.kind[k]===2){dctx.fillStyle=DARK?'rgba(210,130,150,.8)':'rgba(190,110,90,.6)';dctx.beginPath();dctx.arc(x+8+R.range(-2,2),y+8+R.range(-2,2),3+a*2,0,7);dctx.fill();dctx.fillStyle=DARK?'rgba(230,160,170,.5)':'rgba(160,80,70,.4)';dctx.beginPath();dctx.arc(x+8+R.range(-4,4),y+8+R.range(-4,4),2+a,0,7);dctx.fill();}
  else{const n=Math.ceil(Math.min(1.3,a)*7),cr=S.kind[k]===1;for(let i=0;i<n;i++){dctx.fillStyle=cr?(DARK?'#d9b98a':'#b98a4f'):(DARK?'rgba(200,190,210,.75)':'rgba(110,98,120,.7)');const px=x+1+R()*14,py=y+1+R()*14,r=cr?1.4+R()*1.5:1+R()*1.6;dctx.beginPath();dctx.arc(px,py,r,0,7);dctx.fill();}}
  dctx.globalAlpha=1;
}
function paintAll(){dctx.clearRect(0,0,dirtCv.width,dirtCv.height);for(let k=0;k<S.N;k++)if(S.dirt[k]>0)paintCell(k);}

/* ---------- Ablauf ---------- */
function newGame(){seed=GG.newSeed();own={besen:1};money=0;total=0;results=[];tool='besen';setup(0);showStart();}
function setup(i){
  hi=i;S=build(HOUSES[i],GG.rng(seed+i*7919+11));paintAll();tLeft=S.def.time;started=false;earned=0;state='idle';sparks=[];
  P={x:S.start.x,y:S.start.y,fx:1,fy:0};fill={hand:0,boden:0,akku:0};bat=1;plug=null;
  tool=['akku','boden','hand','besen'].find(t=>own[t])||'besen';if(tool==='boden')plugNearest();
  robots=[];if(own.robo)for(let n=0;n<(own.robo2?2:1);n++)robots.push({x:S.dock.x+n*4,y:S.dock.y,a:n*2.4+.6,path:[],wait:0});
  dog=S.def.dog?{x:S.rooms[1].x+S.rooms[1].w/2,y:S.rooms[1].y+S.rooms[1].h*.7,a:1,drop:0,turn:0}:null;
}
function begin(){ov.hide();state='play';const R=reachMax(S);if(R.max<ZIEL)GG.toast(`Achtung: ohne ${R.kurz.join(' und ')} schaffst du höchstens ${Math.floor(R.max*100)} %`,COL.rose);else GG.toast(`${S.def.name}: ${Math.round(ZIEL*100)} % sauber ist das Ziel`,COL.violet);}
function reachMax(H){const under=(own.flach&&(own.hand||own.boden||own.akku))||own.robo,miss=(own.mopp?0:H.stainTot)+(under?0:H.underTot);
  const need=[];if(!own.mopp&&H.stainTot>0)need.push('<strong>Wischmopp</strong> (Flecken)');if(!under&&H.underTot>0)need.push('<strong>Flachdüse oder Saugroboter</strong> (Staub unter Sofa und Bett)');
  const kurz=[];if(!own.mopp&&H.stainTot>0)kurz.push('Wischmopp');if(!under&&H.underTot>0)kurz.push('Flachdüse oder Roboter');
  return{max:1-miss/H.total,need,kurz};}
function remaining(){let r=0;for(let k=0;k<S.N;k++)r+=S.dirt[k];return r;}
const cleanPct=()=>1-remaining()/(S.total+S.added);
function plugNearest(){let b=null,bd=1e9;for(const s of S.sockets){const d=Math.hypot(s.x-P.x,s.y-P.y);if(d<bd){bd=d;b=s;}}plug=b;}
function setTool(t){if(!own[t]||t===tool||state!=='play'&&state!=='idle')return;tool=t;if(t==='boden'&&!plug){plug=socketNear(null);if(!plug)say('Bodensauger steckt nicht. Zu einer Steckdose gehen und E drücken',COL.amber);}GG.sfx('tick');}
const PLUGR=70;
function socketNear(skip){let b=null,bd=PLUGR;for(const s of S.sockets){const d=Math.hypot(s.x-P.x,s.y-P.y);if(s!==skip&&d<bd){bd=d;b=s;}}return b;}
function replug(){const b=socketNear(plug);
  if(b){plug=b;GG.sfx('pop');GG.toast('Eingesteckt',COL.sea);return true;}
  if(plug){plug=null;GG.sfx('tick');GG.toast('Stecker gezogen. An einer Steckdose wieder E drücken',COL.amber);msgCd=2.5;return false;}
  say('Keine Steckdose in der Nähe. Zu einer Steckdose gehen und E drücken',COL.amber);return false;}
function say(m,c){if(msgCd<=0){GG.toast(m,c);msgCd=2.5;}}
function collide(o,r){
  for(let it=0;it<2;it++){for(const w of S.walls)push(o,w,r);for(const f of S.furn)if(r===PR||!f.low)push(o,f,r);}
}
function push(o,b,r){if(o.x<b.x-r||o.x>b.x+b.w+r||o.y<b.y-r||o.y>b.y+b.h+r)return;const cx=clamp(o.x,b.x,b.x+b.w),cy=clamp(o.y,b.y,b.y+b.h),dx=o.x-cx,dy=o.y-cy,d=Math.hypot(dx,dy);
  if(d<r){if(d>0){o.x=cx+dx/d*r;o.y=cy+dy/d*r;}else{const l=o.x-b.x,rr=b.x+b.w-o.x,t=o.y-b.y,bb=b.y+b.h-o.y,m=Math.min(l,rr,t,bb);if(m===l)o.x=b.x-r;else if(m===rr)o.x=b.x+b.w+r;else if(m===t)o.y=b.y-r;else o.y=b.y+b.h+r;}}}
function suck(x,y,r,rate,carpet,opt,dt){ // gibt die entfernte Menge zurück
  let got=0;const i0=Math.max(0,Math.floor((x-r)/CS)),i1=Math.min(GX-1,Math.floor((x+r)/CS)),j0=Math.max(0,Math.floor((y-r)/CS)),j1=Math.min(GY-1,Math.floor((y+r)/CS));
  for(let j=j0;j<=j1;j++)for(let i=i0;i<=i1;i++){const k=j*GX+i,a=S.dirt[k];if(a<=0)continue;const cx=(i+.5)*CS,cy=(j+.5)*CS;if(Math.hypot(cx-x,cy-y)>r+5)continue;
    if(S.block[k]===1||(S.block[k]===2&&!opt.under))continue;if((S.kind[k]===2)!==!!opt.mop)continue;if(opt.from&&wallBetween(opt.from.x,opt.from.y,cx,cy))continue;
    const d=Math.min(a,rate*(S.floor[k]===3?carpet:1)*dt,opt.room!=null?opt.room-got:1e9);if(d<=0)continue;const b0=Math.ceil(Math.min(1.3,a)*7);S.dirt[k]=a-d;got+=d;
    if(S.dirt[k]<=.02){got+=S.dirt[k];S.dirt[k]=0;paintCell(k);if(sparks.length<60)sparks.push({x:cx,y:cy,t:.5});}else if(Math.ceil(Math.min(1.3,S.dirt[k])*7)!==b0||S.kind[k]===2)paintCell(k);}
  return got;
}
function update(dt){
  msgCd-=dt;for(const s of sparks)s.t-=dt;sparks=sparks.filter(s=>s.t>0);
  if(state!=='play')return;
  const st=stat(tool);let mx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),my=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
  if(mx||my)started=true;
  if(started){tLeft-=dt;if(tLeft<=0){tLeft=0;return finish(false);}}
  const l=Math.hypot(mx,my);if(l>0){mx/=l;my/=l;const k=Math.min(1,dt*12);P.fx+=(mx-P.fx)*k;P.fy+=(my-P.fy)*k;const fl=Math.hypot(P.fx,P.fy)||1;P.fx/=fl;P.fy/=fl;}
  const sp=185*(own.schuhe?1.2:1)*st.speed;P.x+=mx*sp*dt;P.y+=my*sp*dt;collide(P,PR);
  if(tool==='boden'&&plug){const dx=P.x-plug.x,dy=P.y-plug.y,d=Math.hypot(dx,dy);if(d>st.cable){P.x=plug.x+dx/d*st.cable;P.y=plug.y+dy/d*st.cable;say('Kabel zu kurz! Mit E Stecker ziehen und woanders einstecken',COL.amber);}}
  // Behälter leeren, Akku laden
  if(sauger(tool)&&fill[tool]>0&&Math.hypot(P.x-S.bin.x,P.y-S.bin.y)<44){fill[tool]=0;GG.sfx('pop');}
  if(Math.hypot(P.x-S.dock.x,P.y-S.dock.y)<44)bat=Math.min(1,bat+dt*.3);
  // putzen
  let on=started;if(tool==='boden'&&!plug){on=false;if(started)say('Kein Strom: zu einer Steckdose gehen und E drücken',COL.amber);}
  if(sauger(tool)&&fill[tool]>=st.cap){on=false;say('Behälter voll! Am Mülleimer in der Küche leeren',COL.amber);}
  if(tool==='akku'){if(bat<=0){on=false;say('Akku leer! An der Ladestation aufladen',COL.amber);}else if(on)bat=Math.max(0,bat-dt/st.bat);}
  if(on){const tx=P.x+P.fx*(10+st.r*.55),ty=P.y+P.fy*(10+st.r*.55);let got=suck(tx,ty,st.r,st.rate,st.carpet,{under:own.flach&&sauger(tool),mop:st.mop,from:P,room:sauger(tool)?st.cap-fill[tool]:null},dt);
    if(own.flach&&sauger(tool)&&fill[tool]<st.cap)for(const ex of[30,60]){const ux=tx+P.fx*ex,uy=ty+P.fy*ex;if(S.block[cellOf(ux,uy)]!==2)break;got+=suck(ux,uy,st.r,st.rate,st.carpet,{under:true,room:st.cap-fill[tool]-got},dt);}
    if(got>0){if(sauger(tool))fill[tool]=Math.min(st.cap,fill[tool]+got);pay(got);if(Math.random()<dt*9)GG.tone(tool==='besen'?260:tool==='mopp'?340:180,.05,'triangle',.012);}}
  // Saugroboter
  const rsp=own.robo3?120:75;
  for(const r of robots){
    if(own.karte){if(!r.path.length){r.wait-=dt;if(r.wait<=0){r.path=pathTo(cellOf(r.x,r.y),c=>S.block[c]!==1,c=>S.dirt[c]>.05&&S.kind[c]!==2&&!robots.some(o=>o!==r&&o.goal===c))||[];r.goal=r.path[r.path.length-1];r.wait=.6;}}
      if(r.path.length){const[tx,ty]=cxy(r.path[0]),dx=tx-r.x,dy=ty-r.y,d=Math.hypot(dx,dy);r.a=Math.atan2(dy,dx);if(d<3)r.path.shift();else{r.x+=dx/d*Math.min(d,rsp*dt);r.y+=dy/d*Math.min(d,rsp*dt);}}}
    else{const nx=r.x+Math.cos(r.a)*rsp*dt,ny=r.y+Math.sin(r.a)*rsp*dt,c=cellOf(nx+Math.cos(r.a)*12,ny+Math.sin(r.a)*12);if(S.block[c]===1||!S.floor[c]){r.a+=PI*.55+Math.random()*1.6;}else{r.x=nx;r.y=ny;}}
    const got=suck(r.x,r.y,13,5,.7,{under:true},dt);if(got>0)pay(got);
  }
  // Hund
  if(dog){dog.turn-=dt;const nx=dog.x+Math.cos(dog.a)*55*dt,ny=dog.y+Math.sin(dog.a)*55*dt,c=cellOf(nx+Math.cos(dog.a)*14,ny+Math.sin(dog.a)*14);
    if(S.block[c]!==0||dog.turn<=0){dog.a+=PI*.5+Math.random()*2;dog.turn=2+Math.random()*4;}else{dog.x=nx;dog.y=ny;}
    dog.drop+=dt;if(dog.drop>1.6&&S.added<S.total*.12){dog.drop=0;const k=cellOf(dog.x,dog.y);if(S.block[k]===0&&S.kind[k]!==2){const a=Math.min(.45,1.3-S.dirt[k]);if(a>0){S.dirt[k]+=a;S.added+=a;S.kind[k]=0;paintCell(k);}}}}
  if(cleanPct()>=ZIEL)finish(true);
}
function pay(units){const e=units*S.eur;money+=e;earned+=e;}
function finish(ok){
  if(state!=='play')return;state='done';
  const pct=cleanPct(),used=S.def.time-tLeft,bonus=ok?Math.round(1000*tLeft/S.def.time):0,base=ok?1000:Math.round(1000*pct/ZIEL),pts=base+bonus,praemie=ok?Math.round(tLeft*2):0;
  money+=praemie;total+=pts;results.push({name:S.def.name,ok,pts,pct,used});
  GG.sfx(ok?'win':'thud');
  setTimeout(()=>showSummary(ok,pts,[[ok?'Haus sauber':`${Math.floor(pct*100)} % sauber`,GG.num(base)],...(ok?[[`Zeitbonus (${used.toFixed(0)} s von ${S.def.time} s)`,`+${GG.num(bonus)}`]]:[]),['Verdient',`${GG.num(earned)} €`],...(ok?[['Prämie fürs Tempo',`+${praemie} €`]]:[])]),ok?600:300);
}

/* ---------- Zeichnen ---------- */
const OUT=DARK?'rgba(0,0,0,.5)':'rgba(59,51,70,.32)',SH=DARK?'rgba(0,0,0,.4)':'rgba(59,51,70,.2)';
const FL={1:DARK?'#3a332c':'#f1e3c8',2:DARK?'#2c3238':'#e6ecf0',3:DARK?'#3d3148':'#e3d6f0'};
const MOEB={sofa:1,bett:1,tisch:1};
function drawFurn(f){
  const c=ctx,col=COL[f.col]||COL.steel,wood=DARK?'#8a6f5c':'#d9b48f',woodE=DARK?'#5a4638':'#a57d58',white=DARK?'#cfc8bd':'#fbf6ef';
  c.lineWidth=2;c.strokeStyle=OUT;const R=(x,y,w,h,r,fill)=>{GG.rr(c,x,y,w,h,r);c.fillStyle=fill;c.fill();c.stroke();};
  const{x,y,w,h}=f;
  if(f.kind==='sofa'){R(x,y,w,h,10,col);R(x+6,y+16,w-12,h-20,8,DARK?'rgba(255,255,255,.12)':'rgba(255,255,255,.45)');c.beginPath();c.moveTo(x+w/2,y+18);c.lineTo(x+w/2,y+h-6);c.stroke();}
  else if(f.kind==='bett'){R(x,y,w,h,8,white);R(x+4,y+4,w-8,Math.min(h,w)>60?h-8:h-8,6,col);const hz=w>h;R(hz?x+6:x+8,hz?y+10:y+6,hz?28:w-16,hz?h-20:24,6,white);}
  else if(f.kind==='tisch'||f.kind==='tischk'||f.kind==='esstisch'||f.kind==='insel'){R(x,y,w,h,6,wood);c.strokeStyle=woodE;c.lineWidth=1;c.strokeRect(x+5,y+5,w-10,h-10);}
  else if(f.kind==='stuhl'){R(x,y,w,h,7,col);}
  else if(f.kind==='schrank'||f.kind==='board'||f.kind==='nacht'||f.kind==='kiste'){R(x,y,w,h,4,f.kind==='kiste'?col:wood);c.strokeStyle=woodE;c.lineWidth=1.5;c.beginPath();if(w>h){for(let k=1;k<Math.round(w/40);k++){c.moveTo(x+w*k/Math.round(w/40),y+3);c.lineTo(x+w*k/Math.round(w/40),y+h-3);}}else{for(let k=1;k<Math.round(h/40);k++){c.moveTo(x+3,y+h*k/Math.round(h/40));c.lineTo(x+w-3,y+h*k/Math.round(h/40));}}c.stroke();}
  else if(f.kind==='zeile'){R(x,y,w,h,5,white);c.fillStyle=COL.steel;GG.rr(c,x+w*.12,y+7,54,h-14,4);c.fill();c.stroke();c.fillStyle=DARK?'#26222c':'#4a4152';GG.rr(c,x+w*.55,y+6,60,h-12,4);c.fill();for(const[a,b]of[[.25,.3],[.75,.3],[.25,.7],[.75,.7]]){c.fillStyle=COL.steelDark;c.beginPath();c.arc(x+w*.55+60*a,y+6+(h-12)*b,5,0,7);c.fill();}}
  else if(f.kind==='pflanze'){c.fillStyle=COL.apricot;c.beginPath();c.arc(x+w/2,y+h/2,w*.36,0,7);c.fill();c.stroke();c.fillStyle=DARK?'#4f7d5c':'#8fc79c';for(let k=0;k<5;k++){c.beginPath();c.arc(x+w/2+Math.cos(k*1.26)*w*.28,y+h/2+Math.sin(k*1.26)*w*.28,w*.26,0,7);c.fill();}}
  else if(f.kind==='wanne'){R(x,y,w,h,12,white);R(x+6,y+6,w-12,h-12,10,COL.water);}
  else if(f.kind==='wc'){R(x+4,y,w-8,14,3,white);c.fillStyle=white;c.beginPath();c.ellipse(x+w/2,y+h*.62,w*.42,h*.36,0,0,7);c.fill();c.stroke();}
  else if(f.kind==='becken'){R(x,y,w,h,6,white);c.fillStyle=COL.water;c.beginPath();c.ellipse(x+w/2,y+h/2,w*.3,h*.3,0,0,7);c.fill();}
  else R(x,y,w,h,5,col);
}
function toolIcon(c,t,x,y,s,col){
  c.save();c.translate(x,y);c.scale(s,s);c.strokeStyle=col;c.fillStyle=col;c.lineWidth=2.4;c.lineCap='round';
  if(t==='besen'){c.beginPath();c.moveTo(-7,-9);c.lineTo(3,3);c.stroke();c.fillRect(-1,3,11,6);}
  else if(t==='hand'){GG.rr(c,-9,-4,14,9,4);c.fill();c.beginPath();c.moveTo(5,0);c.lineTo(10,3);c.stroke();}
  else if(t==='boden'){GG.rr(c,-10,-1,13,9,4);c.fill();c.beginPath();c.moveTo(0,-1);c.quadraticCurveTo(4,-11,9,-2);c.lineTo(9,7);c.stroke();}
  else if(t==='akku'){c.beginPath();c.moveTo(-6,-9);c.lineTo(3,5);c.stroke();GG.rr(c,-9,-11,7,6,2);c.fill();c.fillRect(-1,5,11,4);}
  else{c.beginPath();c.moveTo(-6,-9);c.lineTo(2,4);c.stroke();GG.rr(c,-4,4,14,5,2.5);c.fill();}
  c.restore();
}
function draw(dt){
  update(dt);GG.clear(ctx);if(!S)return;const c=ctx,t=performance.now()/1000;
  c.save();c.translate(0,TOP);c.beginPath();c.rect(0,0,W,FH);c.clip();
  // Garten
  c.fillStyle=DARK?'#1f2a22':'#dcebc6';c.fillRect(0,0,W,FH);const gR=GG.rng(hi*31+5);
  for(let k=0;k<26;k++){const x=gR()*W,y=gR()*FH;if(S.rooms.some(r=>x>r.x-40&&x<r.x+r.w+40&&y>r.y-40&&y<r.y+r.h+40))continue;const r=14+gR()*12;c.fillStyle=DARK?'#4f7d5c':'#a9d8b0';c.strokeStyle=DARK?'#36573f':'#79b58a';c.lineWidth=2.5;c.beginPath();c.arc(x,y,r,0,7);c.fill();c.stroke();}
  // Böden, Teppiche
  for(const r of S.rooms){c.fillStyle=FL[r.floor];c.fillRect(r.x,r.y,r.w,r.h);c.strokeStyle=DARK?'rgba(255,255,255,.035)':'rgba(120,90,60,.09)';c.lineWidth=1;
    if(r.floor===2){for(let x=r.x+32;x<r.x+r.w;x+=32){c.beginPath();c.moveTo(x,r.y);c.lineTo(x,r.y+r.h);c.stroke();}for(let y=r.y+32;y<r.y+r.h;y+=32){c.beginPath();c.moveTo(r.x,y);c.lineTo(r.x+r.w,y);c.stroke();}}
    else if(r.floor===1){for(let y=r.y+22;y<r.y+r.h;y+=22){c.beginPath();c.moveTo(r.x,y);c.lineTo(r.x+r.w,y);c.stroke();}}}
  for(const g of S.rugs){GG.rr(c,g.x,g.y,g.w,g.h,8);c.fillStyle=FL[3];c.fill();c.strokeStyle=DARK?'#6d4fa3':'#c9b4e6';c.lineWidth=3;c.stroke();c.setLineDash([3,6]);c.lineWidth=1.5;GG.rr(c,g.x+7,g.y+7,g.w-14,g.h-14,5);c.stroke();c.setLineDash([]);}
  for(const d of S.doors){c.fillStyle=DARK?'#4a3f36':'#e0cba6';c.fillRect(d.x+(d.v?5:0),d.y+(d.v?0:5),d.v?8:d.w,d.v?d.h:8);}
  // niedrige Möbel halb durchsichtig, damit man den Schmutz darunter ahnt

  c.drawImage(dirtCv,0,0,W,GY*CS);

  if(tool==='boden'&&plug){const d=Math.hypot(P.x-plug.x,P.y-plug.y),sl=Math.max(0,1-d/st.cable)*60;c.strokeStyle=d>st.cable*.9?COL.roseInk:(DARK?'#cfc8bd':'#4a4152');c.lineWidth=2.5;c.beginPath();c.moveTo(plug.x,plug.y);c.quadraticCurveTo((plug.x+P.x)/2+sl*.6,(plug.y+P.y)/2+sl,P.x,P.y);c.stroke();}
  const tc={besen:COL.amberInk,hand:COL.waterInk,boden:COL.roseInk,akku:COL.seaInk,mopp:COL.waterInk}[tool];
  c.strokeStyle=DARK?'#cfc8bd':'#4a4152';c.lineWidth=3;c.lineCap='round';c.beginPath();c.moveTo(P.x,P.y);c.lineTo(tx,ty);c.stroke();
  c.save();c.translate(tx,ty);c.rotate(Math.atan2(P.fy,P.fx));c.fillStyle=SH;GG.rr(c,-4,-st.r+3,10,st.r*2,4);c.fill();GG.rr(c,-6,-st.r,10,st.r*2,4);c.fillStyle=tc;c.fill();c.strokeStyle=OUT;c.lineWidth=2;c.stroke();
  if(tool==='besen'){c.strokeStyle=COL.amber;c.lineWidth=2;for(let k=-st.r+3;k<st.r;k+=5){c.beginPath();c.moveTo(4,k);c.lineTo(10,k);c.stroke();}}c.restore();
  GG.drawAvatar(c,GG.myAvatar(),P.x,P.y,PR*2+4,null,COL.violetInk);
  c.restore();
  // Kopfleiste
  c.fillStyle=COL.panel;c.fillRect(0,0,W,TOP);c.strokeStyle=COL.edge;c.lineWidth=1;c.beginPath();c.moveTo(0,TOP+.5);c.lineTo(W,TOP+.5);c.stroke();
  GG.label(c,`HAUS ${hi+1} / ${HOUSES.length}`,20,24,'left',COL.accentInk);GG.text(c,S.def.name,20,50,{size:22,weight:800});
  const pct=clamp(cleanPct(),0,1);GG.label(c,'SAUBER',250,24);GG.rr(c,250,34,190,12,6);c.fillStyle=COL.board;c.fill();GG.rr(c,250,34,Math.max(12,190*pct),12,6);c.fillStyle=pct>=ZIEL?COL.sea:COL.accent;c.fill();c.fillStyle=COL.ink;c.fillRect(250+190*ZIEL-1,31,2,18);
  const RM=reachMax(S);if(RM.max<ZIEL){const mx0=250+190*clamp(RM.max,0,1);c.save();GG.rr(c,250,34,190,12,6);c.clip();c.fillStyle=COL.rose;c.fillRect(mx0,34,440-mx0,12);c.strokeStyle=COL.roseInk;c.lineWidth=1.5;for(let x=mx0-12;x<440;x+=6){c.beginPath();c.moveTo(x,46);c.lineTo(x+12,34);c.stroke();}c.restore();

GG.loop(draw);

/* ---------- Eingabe ---------- */
const GK=['w','a','s','d','arrowup','arrowdown','arrowleft','arrowright',' ','e','q'];
addEventListener('keydown',e=>{const k=e.key.toLowerCase();if(state!=='play')return;if(GK.includes(k))e.preventDefault();keys[k]=true;if(e.repeat)return;
  if(k>='1'&&k<='5')setTool(TOOLS[+k-1]);
  else if(k==='q'){const o=TOOLS.filter(t=>own[t]);setTool(o[(o.indexOf(tool)+1)%o.length]);}
  else if(k==='e'&&tool==='boden')replug();
  else if(k==='enter'&&started){e.preventDefault();finish(cleanPct()>=ZIEL);}});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;});

/* ---------- Karten ---------- */
const hausText=d=>`<strong>${d.name}</strong> · ${d.rooms.length} Räume · ${GG.fmt(d.time)} Minuten. ${d.text}`;
const hausInfo=d=>[d.stains?'Flecken (nur mit Mopp)':'',!d.noLow?'Staub unter Sofa und Bett (Flachdüse oder Roboter)':'',d.carpet?'dicke Teppiche':'',d.dog?'Hund':''].filter(Boolean).join(' · ');
function showStart(){
  ov.show(`<div class="eyebrow">Minispiel · Strategie</div><h2>Blitzblank</h2>
    <p>Fünf Häuser sollen sauber werden. Du fängst mit dem Besen an und kaufst vom verdienten Geld bessere Geräte.</p>
    <ul><li>Laufen mit WASD, das Gerät in deiner Hand putzt von allein. Ab ${Math.round(ZIEL*100)} % ist das Haus fertig.</li>
    <li>Jeder Krümel bringt Geld. Zwischen den Häusern geht es in den Laden: Sauger, Mopp, Roboter und Verbesserungen.</li>
    <li>Ab Haus 2 gibt es Flecken, die nur der <strong>Wischmopp</strong> wegbekommt, und Staub unter Sofa und Bett, an den nur <strong>Flachdüse</strong> oder <strong>Saugroboter</strong> kommen. Ohne das passende Gerät ist ein Haus nicht ganz zu schaffen.</li>
    <li>Sauger müssen am Mülleimer geleert werden. Der Bodensauger hängt am Kabel: mit <kbd>E</kbd> den Stecker ziehen und an einer anderen Steckdose wieder einstecken. Der Akkusauger braucht die Ladestation.</li>
    <li>Sauberes Haus: 1.000 Punkte plus bis zu 1.000 für die Zeit. Sonst zählt, wie sauber es geworden ist. Geld ausgeben lohnt sich: Restgeld bringt am Ende nur 1 Punkt je 5 €.</li></ul>
    <div class="next">Haus 1 · ${hausText(HOUSES[0])}</div>
    <button class="go" type="button">Besen schnappen</button>`,begin);
}
function showSummary(ok,pts,detail){
  const last=hi>=HOUSES.length-1,rest=Math.round(money/5);
  if(last){total+=rest;GG.report(total);}
  ov.show(`<div class="eyebrow">Haus ${hi+1} · ${S.def.name}</div><h2>${ok?'Blitzblank!':tLeft>0?'Vorzeitig abgegeben':'Zeit abgelaufen'}</h2>
    ${GG.rowsHtml([...detail,['Haus',`+${GG.num(pts)}`,'total'],...(last?[[`Restgeld ${GG.num(money)} € (5 € = 1 Punkt)`,`+${GG.num(rest)}`]]:[]),['Gesamt',GG.num(total)]])}
    ${last?`<div class="big">${GG.num(total)}</div>${GG.rowsHtml(results.map((r,i)=>[`${i+1}. ${r.name} · ${r.ok?GG.fmt(r.used):Math.floor(r.pct*100)+' %'}`,`+${GG.num(r.pts)}`]))}`:''}
    <button class="go" type="button">${last?(GG.room?'Zurück zum Warteraum':'Nochmal'):'Zum Laden'}</button>`,last?(GG.room?GG.backToLobby:newGame):showShop);
}
function nodeState(n){return own[n.id]?'have':n.req&&!own[n.req]?'gesperrt':money<n.cost?'zu':'kaufbar';}
let nextH=null;
function showShop(){
  if(!nextH||nextH.i!==hi+1)nextH={i:hi+1,H:build(HOUSES[hi+1],GG.rng(seed+(hi+1)*7919+11))};const RM=reachMax(nextH.H);
  const nx=HOUSES[hi+1],depth=n=>{let d=0;for(let q=n;q.req&&SHOP.find(o=>o.id===q.req).z===n.z;q=SHOP.find(o=>o.id===q.req))d++;return d;};
  ovEl.innerHTML=`<div class="card wide"><div class="shophead"><div><div class="eyebrow">Laden · vor Haus ${hi+2}</div><h2>Was nimmst du mit?</h2></div><div class="geld">${GG.num(money)} €</div></div>
    <div class="next">Als Nächstes: ${hausText(nx)}${hausInfo(nx)?`<br><strong>Dort gibt es:</strong> ${hausInfo(nx)}`:''}</div>
    ${RM.max<ZIEL?`<div class="warn">Mit deinen Geräten wird Haus ${hi+2} höchstens <strong>${Math.floor(RM.max*100)} %</strong> sauber, fertig ist es erst ab ${Math.round(ZIEL*100)} %. Es fehlt: ${RM.need.join(' und ')}.</div>`:`<div class="okmsg">Mit deinen Geräten ist Haus ${hi+2} komplett zu schaffen.</div>`}
    <div class="tree">${ZWEIG.map((z,zi)=>`<div class="branch"><div class="lbl">${z}</div>${SHOP.filter(n=>n.z===zi).map(n=>{const s=nodeState(n),d=depth(n);
      return`<button type="button" class="node ${s}${d>0?' kind':''}${d>1?' kind2':''}" data-buy="${n.id}"${s==='kaufbar'?'':' aria-disabled="true"'}>${n.name}<span class="preis">${s==='have'?'gekauft':n.cost+' €'}</span><small>${s==='gesperrt'?'braucht: '+SHOP.find(q=>q.id===n.req).name:n.txt}</small></button>`;}).join('')}</div>`).join('')}</div>
    <div class="btnrow"><button class="go" type="button">Haus ${hi+2} putzen</button></div></div>`;
  ovEl.hidden=false;GG.addLeave(ovEl);
  ovEl.querySelectorAll('[data-buy]').forEach(b=>b.addEventListener('click',()=>{const n=SHOP.find(q=>q.id===b.dataset.buy);if(nodeState(n)!=='kaufbar')return;money-=n.cost;own[n.id]=1;GG.sfx('ok');showShop();}));
  ovEl.querySelector('button.go').addEventListener('click',()=>{GG.audio();setup(hi+1);begin();});
}
document.getElementById('restart').addEventListener('click',newGame);
newGame();
})();
