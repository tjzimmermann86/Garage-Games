<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Laser & Spiegel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/garage.css">
<style>:root{--accent:#e5626b}</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Laser <em>&amp; Spiegel</em></h1>
      <div class="sub">Minispiel der Garage Games · 5 Runden</div>
    </div>
    <div class="actions">
      <a class="ghost" href="../">Alle Spiele</a>
      <button class="ghost" id="restart" type="button">Neu starten</button>
    </div>
  </header>
  <div class="stage">
    <canvas id="cv" aria-label="Laser-Spielfeld"></canvas>
    <div class="overlay" id="ov"></div>
  </div>
  <div class="keys">
    <span><kbd>Klick</kbd> Spiegel umklappen</span>
    <span>Die Runde endet, sobald jeder Kristall leuchtet</span>
  </div>
</div>
<script src="../shared/garage.js"></script>
<script>
(()=>{
const{W,H,COL,MONO,DISPLAY}=GG;
const cv=document.getElementById('cv'),ctx=GG.canvas(cv),ov=GG.overlay(document.getElementById('ov'));
const BX=340,BY=100,BS=600;
const DX=[0,1,0,-1],DY=[-1,0,1,0];
const MAP=[[1,0,3,2],[3,2,1,0]];            // Spiegel "/" und "\": neue Richtung je Einfallsrichtung (N,O,S,W)
const BEAM=[COL.rose,COL.sea,COL.violet];

const POOLS=[
  [{name:'Werkstattlampe',w:6,h:5,lasers:['left'],m:[3],decoys:2,crystals:2,walls:0},
   {name:'Kellerfenster', w:5,h:6,lasers:['top'], m:[3],decoys:2,crystals:2,walls:0},
   {name:'Garagentor',    w:7,h:4,lasers:['left'],m:[3],decoys:3,crystals:2,walls:1}],
  [{name:'Hobelbank',     w:7,h:6,lasers:['left'],m:[5],decoys:4,crystals:3,walls:1},
   {name:'Schaltschrank', w:6,h:7,lasers:['bottom'],m:[5],decoys:4,crystals:3,walls:2},
   {name:'Ölkammer',      w:7,h:7,lasers:['left','top'],m:[3,3],decoys:3,crystals:3,walls:0}],
  [{name:'Kühlraum',      w:8,h:6,lasers:['left'],m:[6],decoys:7,crystals:4,walls:3},
   {name:'Lichtschacht',  w:7,h:8,lasers:['top'], m:[6],decoys:7,crystals:4,walls:3},
   {name:'Doppelstrahl',  w:8,h:7,lasers:['left','right'],m:[4,4],decoys:5,crystals:4,walls:2}],
  [{name:'Spiegelsaal',   w:9,h:7,lasers:['left'],m:[8],decoys:10,crystals:5,walls:4},
   {name:'Kreuzfeuer',    w:8,h:8,lasers:['top','left'],m:[5,5],decoys:8,crystals:5,walls:3},
   {name:'Labyrinth',     w:9,h:8,lasers:['bottom'],m:[8],decoys:8,crystals:5,walls:8}],
  [{name:'Laserhalle',    w:10,h:8,lasers:['left'],m:[10],decoys:12,crystals:6,walls:5},
   {name:'Dreifachstrahl',w:9,h:9,lasers:['left','top','right'],m:[5,5,4],decoys:10,crystals:6,walls:4},
   {name:'Großlabor',     w:10,h:9,lasers:['bottom','left'],m:[7,6],decoys:12,crystals:6,walls:6}],
];

let seed,ROUNDS=[],ri=0,round,gw,gh,cs,ox,oy,grid=[],lasers=[],beams=[],litSet=new Set(),nCrystals=0,nMirrors=0;
let playing=false,t0=0,endSecs=0,clicks=0,total=0,results=[],wonAt=0,hover=-1;

/* ---------- Rätsel erzeugen: Strahlwege mit Spiegeln, Kristalle auf dem Weg, Attrappen daneben ---------- */
function startOf(side,R){
  if(side==='left')return{x:0,y:R.int(0,gh-1),d:1};
  if(side==='right')return{x:gw-1,y:R.int(0,gh-1),d:3};
  if(side==='top')return{x:R.int(0,gw-1),y:0,d:2};
  return{x:R.int(0,gw-1),y:gh-1,d:0};
}
function walk(g,st,target,R,used){
  let x=st.x,y=st.y,d=st.d,run=0;const cells=[],mir=[],local=new Set();
  for(let s=0;s<gw*gh*3;s++){
    if(x<0||y<0||x>=gw||y>=gh)break;
    const i=y*gw+x,c=g[i];
    if(c.t==='m'||c.t==='w')return null;
    const first=!local.has(i)&&!used.has(i);
    cells.push(i);local.add(i);
    if(first&&run>=1&&mir.length<target&&R()<0.5){
      const opts=[(d+1)&3,(d+3)&3].filter(nd=>{const nx=x+DX[nd],ny=y+DY[nd];return nx>=0&&ny>=0&&nx<gw&&ny<gh&&g[ny*gw+nx].t!=='m';});
      if(opts.length){const nd=R.pick(opts);c.t='m';c.o=c.sol=MAP[0][d]===nd?0:1;mir.push(i);d=nd;run=0;}
    }
    x+=DX[d];y+=DY[d];run++;
  }
  return mir.length<target?null:{cells,mir};
}
function generate(R){
  for(let attempt=0;attempt<800;attempt++){
    const g=Array.from({length:gw*gh},()=>({t:'',o:0}));const used=new Set(),ls=[],cand=[];let ok=true;
    for(let k=0;k<round.lasers.length;k++){
      const st=startOf(round.lasers[k],R);
      if(ls.some(l=>l.x===st.x&&l.y===st.y)||g[st.y*gw+st.x].t){ok=false;break;}
      const res=walk(g,st,round.m[k],R,used);if(!res){ok=false;break;}
      const firstM=res.cells.indexOf(res.mir[0]);
      res.cells.forEach((i,j)=>{used.add(i);if(j>firstM&&g[i].t==='')cand.push(i);});
      ls.push({...st,color:BEAM[k]});
    }
    if(!ok)continue;
    const uniq=[...new Set(cand)];if(uniq.length<round.crystals)continue;
    R.shuffle(uniq).slice(0,round.crystals).forEach(i=>g[i].t='c');
    const free=R.shuffle([...Array(gw*gh).keys()].filter(i=>!used.has(i)&&g[i].t===''));
    free.slice(0,round.walls).forEach(i=>g[i].t='w');
    free.slice(round.walls,round.walls+round.decoys).forEach(i=>{g[i].t='m';g[i].o=R.int(0,1);});
    return{g,ls};
  }
  return null;
}
function trace(L){
  let x=L.x,y=L.y,d=L.d;const e=Math.min(.9,24/cs),pts=[[x+.5-DX[d]*e,y+.5-DY[d]*e]],hits=[],seen=new Set();
  for(let s=0;s<gw*gh*4;s++){
    if(x<0||y<0||x>=gw||y>=gh){pts.push([x+.5-DX[d]*.5,y+.5-DY[d]*.5]);break;}
    const i=y*gw+x,c=grid[i],key=i*4+d;
    if(seen.has(key)){pts.push([x+.5,y+.5]);break;}seen.add(key);
    if(c.t==='w'){pts.push([x+.5-DX[d]*.5,y+.5-DY[d]*.5]);break;}
    if(c.t==='c')hits.push(i);
    if(c.t==='m'){pts.push([x+.5,y+.5]);d=MAP[c.o][d];}
    x+=DX[d];y+=DY[d];
  }
  return{pts,hits,color:L.color};
}
function recompute(){beams=lasers.map(trace);litSet=new Set(beams.flatMap(b=>b.hits));}

function newGame(){
  seed=GG.newSeed();const R=GG.rng(seed^0x51ed270b);
  ROUNDS=POOLS.map(p=>R.pick(p));total=0;results=[];setupRound(0);showStart();
}
function setupRound(i){
  ri=i;round=ROUNDS[i];gw=round.w;gh=round.h;
  cs=Math.floor(Math.min((BS-60)/gw,(BS-60)/gh));ox=BX+(BS-gw*cs)/2;oy=BY+(BS-gh*cs)/2;
  const R=GG.rng(seed+i*7919);let res=generate(R);
  let shrink=0;while(!res&&shrink<3){round={...round,crystals:Math.max(2,round.crystals-1),walls:Math.max(0,round.walls-2)};res=generate(R);shrink++;}
  grid=res.g;lasers=res.ls;
  grid.forEach(c=>{if(c.t==='m')c.o=R.int(0,1);});
  recompute();
  nCrystals=grid.filter(c=>c.t==='c').length;nMirrors=grid.filter(c=>c.t==='m').length;
  let guard=0;while(litSet.size===nCrystals&&guard++<50){const ms=grid.filter(c=>c.t==='m');R.pick(ms).o^=1;recompute();}
  playing=false;clicks=0;endSecs=0;wonAt=0;hover=-1;
}
function begin(){ov.hide();playing=true;t0=performance.now();}
const secsNow=()=>playing?(performance.now()-t0)/1000:endSecs;
function win(){
  playing=false;endSecs=secsNow();wonAt=performance.now();GG.sfx('win');
  const par=round.m.reduce((a,b)=>a+b,0)*8+10,base=nCrystals*30,bonus=Math.max(0,Math.round((par-endSecs)*4)),pts=base+bonus;
  total+=pts;results.push({name:round.name,secs:endSecs,clicks,base,bonus,par,pts});
  setTimeout(showSummary,1400);
}

/* ---------- Eingabe ---------- */
function cellAt(p){const x=Math.floor((p.x-ox)/cs),y=Math.floor((p.y-oy)/cs);return x<0||y<0||x>=gw||y>=gh?-1:y*gw+x;}
cv.addEventListener('pointerdown',e=>{
  if(!playing)return;const i=cellAt(GG.local(cv,e));
  if(i<0||grid[i].t!=='m')return;e.preventDefault();
  grid[i].o^=1;grid[i].flip=1;clicks++;GG.sfx('tick');
  const before=litSet.size;recompute();if(litSet.size>before)GG.sfx('pop');
  if(litSet.size===nCrystals)win();
});
cv.addEventListener('pointermove',e=>{const i=cellAt(GG.local(cv,e));hover=playing&&i>=0&&grid[i].t==='m'?i:-1;cv.style.cursor=hover>=0?'pointer':'default';});
cv.addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- Zeichnen ---------- */
function drawCell(i,now){
  const c=grid[i],x=ox+(i%gw)*cs,y=oy+((i/gw)|0)*cs,cx=x+cs/2,cy=y+cs/2;
  ctx.fillStyle=COL.plate;ctx.fillRect(x+1,y+1,cs-2,cs-2);
  if(c.t==='w'){ctx.save();ctx.beginPath();ctx.rect(x+1,y+1,cs-2,cs-2);ctx.clip();ctx.fillStyle=COL.lead;ctx.fill();ctx.strokeStyle='rgba(0,0,0,.3)';ctx.lineWidth=cs*.08;for(let k=-cs;k<cs*2;k+=cs*.25){ctx.beginPath();ctx.moveTo(x+k,y);ctx.lineTo(x+k-cs,y+cs);ctx.stroke();}ctx.restore();}
  if(c.t==='c'){
    const lit=litSet.has(i),s=cs*.28,col=lit?(beams.find(b=>b.hits.includes(i))||{}).color||COL.rose:COL.violet;
    ctx.save();if(lit){ctx.shadowColor=col;ctx.shadowBlur=22+6*Math.sin(now/200);}
    ctx.beginPath();ctx.moveTo(cx,cy-s*1.2);ctx.lineTo(cx+s,cy);ctx.lineTo(cx,cy+s*1.2);ctx.lineTo(cx-s,cy);ctx.closePath();
    ctx.fillStyle=lit?col:'rgba(169,139,240,.18)';ctx.fill();ctx.restore();
    ctx.strokeStyle=lit?'#fff':COL.violet;ctx.lineWidth=1.5;ctx.stroke();
    ctx.beginPath();ctx.moveTo(cx-s,cy);ctx.lineTo(cx+s,cy);ctx.moveTo(cx,cy-s*1.2);ctx.lineTo(cx-s*.3,cy);ctx.lineTo(cx,cy+s*1.2);ctx.strokeStyle=lit?'rgba(255,255,255,.6)':'rgba(169,139,240,.5)';ctx.lineWidth=1;ctx.stroke();
  }
  if(c.t==='m'){
    if(c.flip>0)c.flip=Math.max(0,c.flip-.12);
    ctx.fillStyle=COL.steelDark;ctx.beginPath();ctx.arc(cx,cy,cs*.36,0,7);ctx.fill();
    const a=(c.o?Math.PI/4:-Math.PI/4)+(c.flip||0)*(c.o?-Math.PI/2:Math.PI/2),L=cs*.4;
    ctx.save();ctx.translate(cx,cy);ctx.rotate(a);
    ctx.fillStyle='#d9e6ea';ctx.fillRect(-L,-cs*.045,L*2,cs*.09);ctx.fillStyle='rgba(255,255,255,.9)';ctx.fillRect(-L,-cs*.045,L*2,cs*.025);
    ctx.restore();
    ctx.fillStyle=COL.steel;ctx.beginPath();ctx.arc(cx,cy,cs*.06,0,7);ctx.fill();
    if(i===hover){ctx.strokeStyle=COL.amber;ctx.lineWidth=2;ctx.beginPath();ctx.arc(cx,cy,cs*.42,0,7);ctx.stroke();}
  }
}
function drawBeams(now){
  for(const b of beams){
    const pts=b.pts.map(([u,v])=>[ox+u*cs,oy+v*cs]);
    ctx.save();ctx.lineJoin='round';ctx.lineCap='round';
    ctx.shadowColor=b.color;ctx.shadowBlur=18;ctx.strokeStyle=b.color;ctx.globalAlpha=.85;ctx.lineWidth=5;
    ctx.beginPath();pts.forEach(([x,y],k)=>k?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.stroke();
    ctx.shadowBlur=0;ctx.globalAlpha=1;ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=1.6;ctx.stroke();
    const [ex,ey]=pts[pts.length-1];ctx.fillStyle=b.color;ctx.globalAlpha=.6+.4*Math.sin(now/90);ctx.beginPath();ctx.arc(ex,ey,4,0,7);ctx.fill();
    ctx.restore();
  }
  for(const L of lasers){
    const e=Math.min(.9,24/cs),cx=ox+(L.x+.5-DX[L.d]*e)*cs,cy=oy+(L.y+.5-DY[L.d]*e)*cs;
    ctx.save();ctx.translate(cx,cy);ctx.rotate(L.d*Math.PI/2);
    GG.rr(ctx,-cs*.22,-cs*.05,cs*.44,cs*.36,5);ctx.fillStyle=COL.steelDark;ctx.fill();
    ctx.fillStyle=L.color;ctx.fillRect(-cs*.1,-cs*.14,cs*.2,cs*.12);
    ctx.restore();
  }
}
function draw(dt,now){
  GG.clear(ctx);
  GG.label(ctx,`RUNDE ${ri+1} / ${ROUNDS.length}`,BX,44,'left',COL.accent);
  GG.text(ctx,round.name,BX,82,{size:34,weight:800});
  const tw=ctx.measureText(round.name).width;GG.text(ctx,`${gw} × ${gh}`,BX+tw+14,82,{size:15,font:MONO,color:COL.muted});
  GG.label(ctx,'ZEIT',BX+BS,44,'right');GG.value(ctx,GG.fmt(secsNow()),BX+BS,82,'right',COL.ink,34);

  ctx.fillStyle=COL.board;ctx.fillRect(ox-30,oy-30,gw*cs+60,gh*cs+60);
  ctx.strokeStyle=COL.lead;ctx.lineWidth=4;ctx.strokeRect(ox-2,oy-2,gw*cs+4,gh*cs+4);
  for(let i=0;i<gw*gh;i++)drawCell(i,now);
  drawBeams(now);
  if(wonAt){const a=Math.max(0,1-(now-wonAt)/900);ctx.fillStyle=`rgba(255,255,255,${a*.25})`;ctx.fillRect(ox,oy,gw*cs,gh*cs);}

  GG.panel(ctx,16,100,300,600);
  GG.label(ctx,'SO GEHT’S',36,132);
  let y=GG.wrap(ctx,'Klapp die Spiegel um, bis jeder Laserstrahl seine Kristalle trifft. Ein Strahl darf durch mehrere Kristalle laufen.',36,160,260,21)+8;
  y=GG.wrap(ctx,'Nicht jeder Spiegel gehört zur Lösung, und Betonblöcke stoppen den Strahl.',36,y,260,21)+12;
  GG.hr(ctx,36,296,y-6);y+=20;
  GG.label(ctx,'DIESE RUNDE',36,y);y+=28;
  [['Laser',String(lasers.length)],['Kristalle',String(nCrystals)],['Spiegel',String(nMirrors)],['Betonblöcke',String(grid.filter(c=>c.t==='w').length)]].forEach(([a,b])=>{GG.text(ctx,a,36,y,{color:COL.muted});GG.text(ctx,b,296,y,{font:MONO,weight:600,align:'right'});y+=26;});
  y+=8;lasers.forEach((L,k)=>{ctx.fillStyle=L.color;ctx.fillRect(36,y-10,26,4);GG.text(ctx,`Laser ${k+1}`,72,y-4,{size:14,color:COL.muted});y+=22;});

  GG.panel(ctx,964,100,300,600);
  GG.label(ctx,'PUNKTE',984,132);GG.value(ctx,GG.num(total),984,168);
  GG.label(ctx,'KRISTALLE GETROFFEN',984,212);GG.value(ctx,`${litSet.size} / ${nCrystals}`,984,248);
  GG.rr(ctx,984,262,260,8,4);ctx.fillStyle=COL.board;ctx.fill();
  if(litSet.size){GG.rr(ctx,984,262,260*litSet.size/nCrystals,8,4);ctx.fillStyle=COL.accent;ctx.fill();}
  GG.label(ctx,'KLICKS',984,314);GG.value(ctx,String(clicks),984,350);
  GG.wrap(ctx,'Tipp: Verfolge den Strahl rückwärts vom Kristall zum Laser.',984,640,260,21,{color:COL.muted});
  GG.drawToast(ctx,BX+BS/2,BY+BS-30,dt);
}
GG.loop(draw);

/* ---------- Karten ---------- */
const roundText=r=>`<strong>${r.name}</strong> · ${r.w} × ${r.h}, ${r.lasers.length} ${r.lasers.length>1?'Laser':'Laser'}, ${r.crystals} Kristalle.`;
function showStart(){
  ov.show(`<div class="eyebrow">Minispiel · Logik</div><h2>Laser &amp; Spiegel</h2>
    <p>Lenk die Laserstrahlen über die Spiegel so, dass jeder Kristall leuchtet.</p>
    <ul><li>Ein Klick klappt einen Spiegel von / nach \\ und zurück.</li>
    <li>Mit jeder Runde wird das Feld größer, mit mehr Spiegeln, Attrappen und Betonblöcken.</li>
    <li>Jedes Spiel zieht pro Runde ein anderes Feld, manche mit zwei oder drei Lasern.</li></ul>
    <div class="next">Runde 1 · ${roundText(ROUNDS[0])}</div>
    <button class="go" type="button">Runde 1 starten</button>`,begin);
}
function showSummary(){
  const r=results[results.length-1];
  if(ri>=ROUNDS.length-1)return showFinal();
  const nx=ROUNDS[ri+1];
  ov.show(`<div class="eyebrow">Runde ${ri+1} geschafft · ${r.name}</div><h2>${GG.fmt(r.secs)} Minuten</h2>
    ${GG.rowsHtml([[`${nCrystals} Kristalle × 30`,`+${r.base}`],[`Zeitbonus (Ziel ${GG.fmt(r.par)})`,`+${r.bonus}`],['Klicks',String(r.clicks)],['Runde',GG.num(r.pts),'total'],['Gesamt',GG.num(total)]])}
    <div class="next">Runde ${ri+2} · ${roundText(nx)}</div>
    <button class="go" type="button">Runde ${ri+2} starten</button>`,()=>{setupRound(ri+1);begin();});
}
function showFinal(){
  ov.show(`<div class="eyebrow">Alle ${ROUNDS.length} Runden geschafft</div><h2>Gesamtpunkte</h2><div class="big">${GG.num(total)}</div>
    ${GG.rowsHtml(results.map((r,i)=>[`${i+1}. ${r.name} · ${GG.fmt(r.secs)}`,GG.num(r.pts)]))}
    <button class="go" type="button">Nochmal mit neuen Feldern</button>`,newGame);
}
document.getElementById('restart').addEventListener('click',newGame);
newGame();
})();
</script>
</body>
</html>
