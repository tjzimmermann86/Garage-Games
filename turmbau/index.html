<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turmbau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/garage.css">
<style>:root{--accent:#f0b24a}</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Turm<em>bau</em></h1>
      <div class="sub">Minispiel der Garage Games · höchster Turm gewinnt</div>
    </div>
    <div class="actions">
      <a class="ghost" href="../">Alle Spiele</a>
      <button class="ghost" id="restart" type="button">Neu starten</button>
    </div>
  </header>
  <div class="stage">
    <canvas id="cv" aria-label="Turm"></canvas>
    <div class="overlay" id="ov"></div>
  </div>
  <div class="keys">
    <span><kbd>Klick</kbd> <kbd>Leertaste</kbd> Block fallen lassen</span>
    <span>Was übersteht, wird abgeschnitten. Daneben = Turm fertig</span>
  </div>
</div>
<script src="../shared/garage.js"></script>
<script>
(()=>{
const{W,H,COL,MONO}=GG;
const cv=document.getElementById('cv'),ctx=GG.canvas(cv),ov=GG.overlay(document.getElementById('ov'));
const GROUND=680,BH=34,PX=640,PY=58,ROPE=170,START_W=200,MAX_W=240,G=1500;
const MODES={
  schiene:{name:'Laufkatze',text:'Der Block fährt auf einer Schiene hin und her.'},
  pendel: {name:'Pendel',   text:'Der Block pendelt am Seil. Beim Loslassen fliegt er etwas weiter.'},
  kran:   {name:'Kranfahrt',text:'Der Kran fährt und der Block pendelt dabei. Timing ist alles.'},
};
const MATS={
  kiste:    {name:'Holzkisten',cols:['#a8743f','#93622f','#b98552']},
  container:{name:'Container', cols:['#c93b3b','#2f6db5','#e8b33a','#3a9a5b','#e07b2f']},
  ziegel:   {name:'Ziegel',    cols:['#b5523b','#a24631','#c4654a']},
};
const PHASE_LEN=6;

let seed,R,modes=[],mat,windFrom=0,blocks=[],cur=null,falling=null,debris=[],t=0,cam=0,height=0,perfects=0,streak=0,state='idle',best=0,wind=0,windT=0,flash=0;
try{best=parseInt(localStorage.getItem('turmbau-best')||'0',10)||0;}catch(e){}

function newGame(){
  seed=GG.newSeed();R=GG.rng(seed);
  modes=R.shuffle(Object.keys(MODES));mat=R.pick(Object.keys(MATS));windFrom=R.pick([2,3]);
  blocks=[{x:PX,w:260,y:-BH,base:true}];debris=[];falling=null;height=0;perfects=0;streak=0;cam=0;t=0;wind=0;state='idle';
  spawn();showStart();
}
const phase=()=>Math.min(modes.length-1,Math.floor(height/PHASE_LEN));
const mode=()=>modes[phase()];
const windOn=()=>phase()>=windFrom-1&&height>=PHASE_LEN*(windFrom-1);
function spawn(){
  const top=blocks[blocks.length-1];
  cur={w:top.base?START_W:top.w,col:MATS[mat].cols[height%MATS[mat].cols.length],t0:t,phase0:R.range(0,Math.PI*2)};
  if(windOn()){wind=R.pick([-1,1])*R.range(40,110);windT=t;}else wind=0;
}
function hangPos(){
  const sp=1+height*.035,tt=t-cur.t0,m=mode();let hx=PX,hy=PY,x,y,vx=0;
  if(m==='schiene'){const w=1.6*sp;x=PX+230*Math.sin(tt*w+cur.phase0);vx=230*w*Math.cos(tt*w+cur.phase0)*.25;y=PY+70;hx=x;}
  else{
    if(m==='kran'){const w2=.9*sp;hx=PX+140*Math.sin(tt*w2+cur.phase0);}
    const amp=m==='kran'?.45:.62,w=(m==='kran'?1.9:2.2)*Math.sqrt(sp),th=amp*Math.sin(tt*w+cur.phase0*1.3),dth=amp*w*Math.cos(tt*w+cur.phase0*1.3);
    x=hx+ROPE*Math.sin(th);y=hy+ROPE*Math.cos(th);vx=ROPE*dth*Math.cos(th)*.5;
  }
  return{hx,hy,x,y,vx};            // y = Unterkante des Seils = Oberkante des Blocks (Bildschirm)
}
const toWorld=sy=>GROUND+cam-sy, toScreen=wy=>GROUND-(wy-cam);
function drop(){
  if(state!=='play'||falling||!cur)return;
  const p=hangPos();falling={x:p.x,w:cur.w,col:cur.col,y:toWorld(p.y+BH),vy:0,vx:p.vx};cur=null;GG.sfx('tick');
}
function land(){
  const f=falling,top=blocks[blocks.length-1],topSurf=top.y+BH;
  const L=Math.max(f.x-f.w/2,top.x-top.w/2),Rr=Math.min(f.x+f.w/2,top.x+top.w/2),ovl=Rr-L;
  if(ovl<=0)return false;
  if(Math.abs(f.x-top.x)<5&&!top.base){f.x=top.x;streak++;perfects++;flash=1;GG.sfx('ok');if(streak>=3){f.w=Math.min(MAX_W,f.w+14);GG.toast('Perfekt-Serie! Block wird breiter');}else GG.toast('Perfekt!');}
  else{
    streak=0;GG.sfx('thud');
    if(!top.base){
      const cutL=f.x-f.w/2<L,cw=f.w-ovl;
      if(cw>.5)debris.push({x:cutL?L-cw/2:Rr+cw/2,w:cw,y:topSurf,vy:0,vx:(cutL?-60:60),rot:0,vr:cutL?-2:2,col:f.col});
      f.x=(L+Rr)/2;f.w=ovl;
    }
  }
  blocks.push({x:f.x,w:f.w,y:topSurf,col:f.col});height++;falling=null;
  if(height%PHASE_LEN===0&&phase()<modes.length&&height/PHASE_LEN<modes.length)GG.toast(`Neu: ${MODES[mode()].name}`);
  if(windOn()&&height===PHASE_LEN*(windFrom-1))setTimeout(()=>GG.toast('Achtung, Wind!'),900);
  spawn();return true;
}
function gameOver(){
  state='over';GG.sfx('err');const score=height*10+perfects*5;
  if(height>best){best=height;try{localStorage.setItem('turmbau-best',String(best));}catch(e){}}
  setTimeout(()=>showOver(score),1400);
}
cv.addEventListener('pointerdown',e=>{e.preventDefault();drop();});
window.addEventListener('keydown',e=>{if((e.code==='Space'||e.key==='Enter')&&!ov.open){e.preventDefault();drop();}});

/* ---------- Zeichnen ---------- */
function drawBlock(x,sy,w,col,rot=0){
  ctx.save();ctx.translate(x,sy-BH/2);ctx.rotate(rot);
  ctx.fillStyle=col;ctx.fillRect(-w/2,-BH/2,w,BH);
  ctx.strokeStyle='rgba(0,0,0,.28)';ctx.lineWidth=2;
  if(mat==='kiste'){for(let k=-w/2+12;k<w/2;k+=24){ctx.beginPath();ctx.moveTo(k,-BH/2);ctx.lineTo(k,BH/2);ctx.stroke();}ctx.strokeRect(-w/2+1,-BH/2+1,w-2,BH-2);}
  else if(mat==='container'){ctx.fillStyle='rgba(0,0,0,.18)';for(let k=-w/2+6;k<w/2-4;k+=10)ctx.fillRect(k,-BH/2+4,4,BH-8);ctx.strokeRect(-w/2+1,-BH/2+1,w-2,BH-2);}
  else{ctx.strokeStyle='rgba(255,230,210,.35)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(-w/2,0);ctx.lineTo(w/2,0);ctx.stroke();for(let k=-w/2+18;k<w/2;k+=36){ctx.beginPath();ctx.moveTo(k,-BH/2);ctx.lineTo(k,0);ctx.moveTo(k+18,0);ctx.lineTo(k+18,BH/2);ctx.stroke();}}
  ctx.fillStyle='rgba(255,255,255,.12)';ctx.fillRect(-w/2,-BH/2,w,4);
  ctx.restore();
}
function update(dt){
  t+=dt;
  if(falling){
    falling.vy-=G*dt;falling.y+=falling.vy*dt;falling.x+=(falling.vx+wind)*dt;
    const top=blocks[blocks.length-1],topSurf=top.y+BH;
    if(!falling.missed&&state==='play'&&falling.y<=topSurf){if(!land()){falling.missed=true;gameOver();}}
    if(falling&&falling.y<cam-200)falling=null;
  }
  for(const d of debris){d.vy-=G*dt;d.y+=d.vy*dt;d.x+=d.vx*dt;d.rot+=d.vr*dt;}
  debris=debris.filter(d=>d.y>cam-300);
  const topY=blocks[blocks.length-1].y+BH,target=Math.max(0,topY-300);cam+=(target-cam)*Math.min(1,dt*4);
  if(flash>0)flash=Math.max(0,flash-dt*2);
}
function draw(dt,now){
  update(dt);GG.clear(ctx);
  const sky=ctx.createLinearGradient(0,0,0,H);const k=Math.min(1,cam/4000);
  sky.addColorStop(0,k>.5?'#0b1030':'#1d2b4a');sky.addColorStop(1,k>.5?'#3b2a6b':'#e08a5d');ctx.fillStyle=sky;ctx.fillRect(330,0,620,H);
  // Stadt im Hintergrund (Parallaxe)
  ctx.fillStyle='rgba(10,12,24,.55)';for(let i=0;i<14;i++){const x=330+i*46,h=(60+((i*73)%110))*1.6,y=GROUND+cam*.3;ctx.fillRect(x,y-h,40,h);}
  ctx.fillStyle='#2a2f35';ctx.fillRect(330,toScreen(0),620,H);
  for(let i=1;i<blocks.length;i++){const b=blocks[i],sy=toScreen(b.y);if(sy>-50&&sy<H+50)drawBlock(b.x,sy,b.w,b.col);}
  const base=blocks[0],bs=toScreen(0);ctx.fillStyle='#6b7378';ctx.fillRect(base.x-base.w/2,bs,base.w,26);ctx.fillStyle='#4e5d63';ctx.fillRect(base.x-base.w/2,bs,base.w,5);
  for(const d of debris)drawBlock(d.x,toScreen(d.y),d.w,d.col,d.rot);
  if(falling)drawBlock(falling.x,toScreen(falling.y),falling.w,falling.col);
  // Kran
  ctx.fillStyle='#3a3f44';ctx.fillRect(330,PY-18,620,12);ctx.fillStyle=COL.amber;for(let x=336;x<950;x+=28){ctx.beginPath();ctx.moveTo(x,PY-18);ctx.lineTo(x+14,PY-6);ctx.lineTo(x+28,PY-18);ctx.strokeStyle=COL.amber;ctx.lineWidth=2;ctx.stroke();}
  if(cur&&state!=='over'){
    const p=hangPos();ctx.fillStyle='#55606a';ctx.fillRect(p.hx-16,PY-10,32,14);
    ctx.strokeStyle='#cfd6da';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.hx,PY);ctx.lineTo(p.x,p.y-6);ctx.stroke();
    ctx.fillStyle='#cfd6da';ctx.fillRect(p.x-8,p.y-8,16,8);
    drawBlock(p.x,p.y+BH,cur.w,cur.col,mode()==='schiene'?0:Math.atan2(p.x-p.hx,p.y-PY)*.0);
    if(state==='play'){const top=blocks[blocks.length-1],ty=toScreen(top.y+BH);ctx.setLineDash([4,6]);ctx.strokeStyle='rgba(255,255,255,.18)';ctx.beginPath();ctx.moveTo(p.x,p.y+BH);ctx.lineTo(p.x,ty);ctx.stroke();ctx.setLineDash([]);}
  }
  if(wind){const dir=Math.sign(wind);GG.rr(ctx,PX-90,PY+12,180,30,15);ctx.fillStyle='rgba(10,16,19,.8)';ctx.fill();GG.text(ctx,`Wind ${dir>0?'→':'←'} ${Math.round(Math.abs(wind))}`,PX,PY+33,{align:'center',font:MONO,size:13,color:COL.water});}
  if(flash>0){ctx.fillStyle=`rgba(255,240,200,${flash*.2})`;ctx.fillRect(330,0,620,H);}
  // Seiten
  ctx.fillStyle=COL.bg;ctx.fillRect(0,0,330,H);ctx.fillRect(950,0,330,H);
  GG.panel(ctx,16,100,300,600);GG.label(ctx,'SO GEHT’S',36,132);
  let y=GG.wrap(ctx,'Lass den Block im richtigen Moment fallen. Was über den Turm hinausragt, wird abgeschnitten.',36,160,260,21)+8;
  y=GG.wrap(ctx,'Triffst du genau, gibt es „Perfekt“. Drei in Folge machen den Block wieder breiter.',36,y,260,21)+12;
  GG.hr(ctx,36,296,y-6);y+=20;GG.label(ctx,'KRANMODUS',36,y);y+=26;
  modes.forEach((m,k)=>{const on=phase()===k;GG.text(ctx,`ab Etage ${k*PHASE_LEN}`,36,y,{size:14,color:COL.muted});GG.text(ctx,MODES[m].name,296,y,{size:14,font:MONO,weight:600,align:'right',color:on?COL.accent:COL.muted});y+=24;});
  GG.text(ctx,`ab Etage ${PHASE_LEN*(windFrom-1)}`,36,y,{size:14,color:COL.muted});GG.text(ctx,'Wind',296,y,{size:14,font:MONO,weight:600,align:'right',color:wind?COL.water:COL.muted});y+=34;
  GG.label(ctx,'MATERIAL',36,y);GG.text(ctx,MATS[mat].name,296,y,{size:14,font:MONO,weight:600,align:'right'});
  GG.panel(ctx,964,100,300,600);
  GG.label(ctx,'ETAGEN',984,132);GG.value(ctx,String(height),984,180,'left',COL.accent,48);
  GG.label(ctx,'PERFEKT',984,232);GG.value(ctx,String(perfects),984,268);
  GG.label(ctx,'PUNKTE',984,316);GG.value(ctx,GG.num(height*10+perfects*5),984,352);
  GG.label(ctx,'DEIN REKORD',984,400);GG.value(ctx,`${best} Etagen`,984,436,'left',COL.ink,26);
  if(cur){GG.label(ctx,'BLOCKBREITE',984,484);GG.rr(ctx,984,496,260,8,4);ctx.fillStyle=COL.board;ctx.fill();GG.rr(ctx,984,496,260*cur.w/MAX_W,8,4);ctx.fillStyle=cur.w<60?COL.rose:COL.accent;ctx.fill();}
  GG.drawToast(ctx,PX,150,dt);
}
GG.loop(draw);

function showStart(){
  ov.show(`<div class="eyebrow">Minispiel · Geschick</div><h2>Turmbau</h2>
    <p>Blöcke pendeln am Kran. Lass sie im richtigen Moment fallen. Der höchste Turm gewinnt.</p>
    <ul><li>Klick oder Leertaste lässt den Block fallen.</li>
    <li>Alle ${PHASE_LEN} Etagen wechselt der Kranmodus, und es wird schneller. Später kommt Wind dazu.</li>
    <li>Reihenfolge der Kranmodi und das Material werden jedes Spiel neu gezogen.</li></ul>
    <div class="next">Start mit <strong>${MODES[modes[0]].name}</strong> · ${MODES[modes[0]].text}</div>
    <button class="go" type="button">Los geht’s</button>`,()=>{ov.hide();state='play';cur.t0=t;});
}
function showOver(score){
  ov.show(`<div class="eyebrow">Daneben · Turm fertig</div><h2>${height} Etagen</h2><div class="big">${GG.num(score)}</div>
    ${GG.rowsHtml([['Etagen × 10',`+${height*10}`],['Perfekt × 5',`+${perfects*5}`],['Dein Rekord',`${best} Etagen`,'total']])}
    <button class="go" type="button">Neuer Turm</button>`,()=>{newGame();ov.hide();state='play';cur.t0=t;});
}
document.getElementById('restart').addEventListener('click',newGame);
newGame();
})();
</script>
</body>
</html>
