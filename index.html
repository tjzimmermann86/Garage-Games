<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>try{if(JSON.parse(localStorage.getItem('gg-settings')||'{}').theme==='dark')document.documentElement.dataset.theme='dark';}catch(e){}</script>
<title>Garage Games</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared/garage.css">
<style>
/* Layout: Kopfzeile, links das Menü (Beenden ganz unten), rechts der Inhalt des gewählten Punkts */
:root{--accent:var(--amber)}
html,body{min-height:100%}
body{padding-block:24px 32px}
.app{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px 24px}
.top .eyebrow{color:var(--amber-ink)}
.top h1{font-size:clamp(2.2rem,6vw,3.6rem);line-height:1;margin:.15em 0 0;letter-spacing:-.02em}
.who{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{font-family:var(--mono);font-size:.75rem;letter-spacing:.06em;border:1px solid var(--panel-edge);border-radius:999px;padding:5px 10px;color:var(--muted);display:inline-flex;gap:6px;align-items:center}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.on .dot{background:var(--sea)}.pill.off .dot{background:var(--amber)}
.pill.me{padding:3px 12px 3px 3px;color:var(--ink);font-family:var(--display);font-weight:600;font-size:.9rem;letter-spacing:0}
.layout{display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px;align-items:start}
@media (max-width:760px){.layout{grid-template-columns:1fr}}
.layout:has(nav[hidden]){grid-template-columns:minmax(0,760px);justify-content:center}
nav.menu{display:flex;flex-direction:column;gap:10px;background:var(--panel);border:1px solid var(--panel-edge);border-radius:14px;padding:14px;min-height:430px}
@media (max-width:760px){nav.menu{min-height:0}}
nav.menu button{appearance:none;text-align:left;border:1px solid transparent;background:transparent;color:var(--ink);font:700 1.15rem var(--display);padding:14px 16px;border-radius:10px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:10px}
nav.menu button small{font:500 .72rem var(--mono);color:var(--muted);letter-spacing:.06em}
nav.menu button:hover{background:var(--plate)}
nav.menu button[aria-current="true"]{background:var(--board);border-color:var(--lead);box-shadow:inset 3px 0 0 var(--amber-ink)}
nav.menu button:disabled{opacity:.4;cursor:default}
nav.menu .spacer{flex:1}
nav.menu button.quit{color:var(--rose-ink);border-color:color-mix(in srgb,var(--rose) 45%,transparent)}
nav.menu button.quit:hover{background:color-mix(in srgb,var(--rose) 12%,transparent)}
main.content,#screen,#invites,#runBanner{display:flex;flex-direction:column;gap:16px;min-width:0}
#invites:empty,#runBanner:empty{display:none}
.box{background:var(--panel);border:1px solid var(--panel-edge);border-radius:14px;padding:22px 24px;display:flex;flex-direction:column;gap:16px;min-width:0}
.box h2{margin:0;font-size:1.6rem;font-weight:800;text-wrap:balance}
.box h3{margin:0;font-size:1.15rem;font-weight:700}
.box p{margin:0;color:var(--muted);line-height:1.5;max-width:62ch}
.label{font:600 .72rem var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:6px}
input[type=text],select{background:var(--board);border:1px solid var(--lead);border-radius:8px;color:var(--ink);font:500 1rem var(--display);padding:10px 12px;min-width:0}
select{align-self:flex-start}
input.code{font:600 1.4rem var(--mono);letter-spacing:.3em;text-transform:uppercase;width:9ch}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{appearance:none;border:0;border-radius:10px;padding:11px 18px;background:var(--amber);color:#2a1d05;font:700 1rem var(--display);cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.4;cursor:default;filter:none}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--panel-edge)}
.btn.sec:hover{background:var(--plate)}
.btn.small{padding:6px 12px;font-size:.88rem}
.btn.danger{background:transparent;color:var(--rose-ink);border:1px solid color-mix(in srgb,var(--rose) 50%,transparent)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border:1px solid var(--lead);border-radius:10px;overflow:hidden;align-self:flex-start;min-width:min(100%,420px)}
@media (max-width:520px){.seg{grid-auto-flow:row;width:100%}}
.seg label{padding:9px 14px;cursor:pointer;color:var(--muted);font-weight:600;position:relative;text-align:center;display:flex;align-items:center;justify-content:center}
.seg label+label{border-left:1px solid var(--lead)}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label:has(input:checked){background:var(--board);color:var(--ink);box-shadow:inset 0 -3px 0 var(--amber-ink)}
.seg label:has(input:focus-visible){outline:3px solid var(--sea);outline-offset:-3px}
.seg label:has(input:disabled){cursor:default}
.games{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.games label{display:flex;gap:10px;align-items:center;background:var(--board);border:1px solid var(--lead);border-radius:10px;padding:10px 12px;cursor:pointer}
.games label span{display:flex;flex-direction:column}
.games small,.item small{font:500 .7rem var(--mono);color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--amber-ink)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;background:var(--board);border:1px solid var(--lead);border-radius:10px;padding:10px 12px}
.item .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.item strong{font-size:1.05rem;overflow-wrap:anywhere}
.item.done{opacity:.6}.item.nextup{border-color:var(--amber-ink)}
.meta{font:500 .78rem var(--mono);color:var(--muted)}
.tag{font:600 .7rem var(--mono);letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:3px 8px;border:1px solid var(--lead);color:var(--muted);white-space:nowrap}
.tag.ok{color:var(--sea-ink);border-color:color-mix(in srgb,var(--sea) 50%,transparent)}
.tag.run{color:var(--amber-ink);border-color:color-mix(in srgb,var(--amber) 50%,transparent)}
.tag.host{color:var(--amber-ink)}
.empty{color:var(--muted);font-style:italic;padding:6px 0}
.lobby{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:16px;align-items:start}
@media (max-width:980px){.lobby{grid-template-columns:1fr}}
.codebig{font:600 2.4rem var(--mono);letter-spacing:.25em;color:var(--amber-ink)}
.invite{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;background:color-mix(in srgb,var(--amber) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--amber) 45%,transparent);border-radius:12px;padding:14px 16px}
.invite .grow{flex:1;min-width:200px}
.banner{background:color-mix(in srgb,var(--sea) 12%,var(--panel));border:1px solid color-mix(in srgb,var(--sea) 45%,transparent);border-radius:12px;padding:14px 16px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.banner .grow{flex:1;min-width:180px}
.slider{display:grid;grid-template-columns:140px 30px minmax(0,320px) 30px 52px;gap:8px;align-items:center}
@media (max-width:520px){.slider{grid-template-columns:30px minmax(0,1fr) 30px 48px}.slider>label{grid-column:1/-1}}
.slider output{font:600 .9rem var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.slider .step{appearance:none;width:30px;height:30px;border-radius:8px;border:1px solid var(--lead);background:var(--board);color:var(--ink);font:700 1.05rem var(--mono);cursor:pointer;line-height:1;padding:0}
.slider .step:hover{background:var(--plate)}
.slider .step:disabled{opacity:.35;cursor:default}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:3px;background:linear-gradient(to right,var(--amber) var(--p,50%),var(--lead) var(--p,50%));cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--panel);border:2px solid var(--amber-ink)}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--panel);border:2px solid var(--amber-ink)}
.hint{font-size:.9rem;color:var(--muted);line-height:1.45}
.hint code{font-family:var(--mono);font-size:.85em;color:var(--ink)}
.hint.bad{color:var(--rose-ink)}.hint.good{color:var(--sea-ink)}
/* Avatar */
.avbtn{appearance:none;border:3px solid var(--amber-ink);border-radius:50%;padding:0;background:none;cursor:pointer;width:84px;height:84px;display:grid;place-items:center;flex:none;position:relative}
.avbtn::after{content:"ändern";position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);font:600 .62rem var(--mono);letter-spacing:.08em;text-transform:uppercase;background:var(--amber);color:#2a1d05;border-radius:999px;padding:2px 7px}
/* Avatar-Auswahl mit Kopfbedeckungen */
.avpick{display:flex;flex-direction:column;gap:10px}
.hats{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.hats button{appearance:none;display:flex;gap:10px;align-items:center;text-align:left;background:var(--board);border:2px solid var(--lead);border-radius:12px;padding:6px 10px;color:var(--ink);font:inherit;cursor:pointer}
.hats button span{display:flex;flex-direction:column;gap:2px;min-width:0}
.hats button small{font-size:.75rem;color:var(--muted);line-height:1.3}
.hats button[aria-pressed="true"]{border-color:var(--amber-ink)}
.hats button.locked{cursor:default;opacity:.7;border-style:dashed}
.hats button.locked svg{filter:grayscale(1);opacity:.7}
.ring{display:inline-grid;flex:none;border-radius:50%;box-shadow:0 0 0 2px var(--panel),0 0 0 5px var(--rc)}
.pod .ring{box-shadow:0 0 0 3px var(--panel),0 0 0 7px var(--rc)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:12px}
.mode{appearance:none;text-align:left;display:flex;flex-direction:column;gap:6px;background:var(--board);border:1px solid var(--lead);border-radius:14px;padding:18px;color:var(--ink);font:inherit;cursor:pointer}
.mode strong{font-size:1.25rem}
.mode span:last-child{color:var(--muted);line-height:1.45}
.mode:hover{border-color:var(--amber-ink)}
.solo{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.solo .game{display:flex;flex-direction:column;gap:6px;background:var(--board);border:1px solid var(--lead);border-radius:12px;padding:14px;color:var(--ink);text-decoration:none}
.solo .game:hover{border-color:var(--amber-ink)}
.solo .game strong{font-size:1.15rem}
.solo .score{display:flex;justify-content:space-between;align-items:baseline;border-top:1px solid var(--lead);padding-top:6px}
.solo .score b{font:600 1.3rem var(--mono);color:var(--amber-ink)}
.solo .btn{align-self:flex-start;margin-top:4px}
.multi{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;align-items:start}
.seg.res span{display:flex;flex-direction:column;align-items:center;gap:1px}
.seg.res small{font:500 .68rem var(--mono);color:var(--muted)}
.bgrow{display:flex;flex-wrap:wrap;gap:8px}
.bgsw{appearance:none;width:36px;height:36px;border-radius:50%;border:3px solid var(--panel);background:var(--c);box-shadow:0 0 0 1px var(--lead);cursor:pointer;padding:0}
.bgsw[aria-pressed="true"]{box-shadow:0 0 0 3px var(--amber-ink)}
.bgsw.auto{width:auto;border-radius:999px;padding:0 12px;font:600 .72rem var(--mono);letter-spacing:.06em;text-transform:uppercase;color:#283047}
.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px;max-width:520px}
.avgrid button{appearance:none;border:2px solid transparent;border-radius:50%;padding:2px;background:none;cursor:pointer;display:grid;place-items:center}
.avgrid button[aria-pressed="true"]{border-color:var(--amber-ink)}
.avgrid button:hover{border-color:var(--lead)}
.who-row{display:flex;gap:22px;align-items:center;flex-wrap:wrap}
/* Abstimmung */
.vote{display:flex;align-items:center;gap:10px;background:var(--board);border:1px solid var(--lead);border-radius:10px;padding:8px 10px}
.vote .grow{flex:1;min-width:0}
.vote .n{font:600 1.3rem var(--mono);width:2ch;text-align:center}
.vote button{appearance:none;width:36px;height:36px;border-radius:8px;border:1px solid var(--lead);background:var(--panel);color:var(--ink);font:700 1.2rem var(--mono);cursor:pointer}
.vote button:disabled{opacity:.35;cursor:default}
.left{font:600 1.1rem var(--mono);color:var(--amber-ink)}
/* Tabelle */
.tablewrap{overflow-x:auto}
table.stand{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;min-width:420px}
table.stand th{font:600 .68rem var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);text-align:right;padding:6px 8px;border-bottom:1px solid var(--lead);white-space:nowrap}
table.stand th:nth-child(-n+2){text-align:left}
table.stand td{padding:8px;border-bottom:1px solid var(--panel-edge);text-align:right;font-family:var(--mono)}
table.stand td:first-child{text-align:left}
table.stand td:nth-child(2){text-align:left;font-family:var(--display);font-weight:600}
table.stand td small{display:block;color:var(--muted);font-size:.72rem}
table.stand td.tot{color:var(--amber-ink);font-weight:600;font-size:1.05rem}
.pl{display:flex;align-items:center;gap:8px}
/* Podest */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end;max-width:640px;margin:0 auto;width:100%}
.pod{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;min-width:0}
.pod strong{font-size:1.1rem;overflow-wrap:anywhere}
.pod .pts{font:600 .9rem var(--mono);color:var(--muted)}
.step{width:100%;border-radius:10px 10px 0 0;display:grid;place-items:center;font:800 2.4rem var(--display);color:#2a1d05}
.p1 .step{height:150px;background:var(--amber)}.p2 .step{height:105px;background:#c7d0d4}.p3 .step{height:75px;background:#c98b5a}
/* Countdown */
.launch{position:fixed;inset:0;background:var(--scrim);backdrop-filter:blur(6px);display:grid;place-items:center;z-index:30;padding:16px}
.launch .card{text-align:center;align-items:center}
.launch .num{font:600 5rem var(--mono);color:var(--amber-ink);line-height:1}
#toast{position:fixed;left:50%;bottom:max(20px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--board);border:1px solid var(--amber);border-radius:999px;padding:10px 18px;font-weight:600;z-index:40;max-width:calc(100% - 32px)}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <div>
      <div class="eyebrow">Lübtheen Garage LAN</div>
      <h1>Garage <em>Games</em></h1>
    </div>
    <div class="who">
      <span class="pill" id="conn"><span class="dot"></span><span id="connText">Verbinde …</span></span>
      <span class="pill me" id="me" hidden></span>
    </div>
  </div>
  <div class="layout">
    <nav class="menu" id="nav" aria-label="Hauptmenü" hidden>
      <button type="button" data-go="solo" id="navSolo">Einzelspieler <small>üben</small></button>
      <button type="button" data-go="multi" id="navMulti">Mehrspieler <small id="navMultiInfo"></small></button>
      <button type="button" data-go="settings">Einstellungen</button>
      <div class="spacer"></div>
      <button type="button" data-go="quit" class="quit">Spiel beenden</button>
    </nav>
    <main class="content">
      <div id="invites"></div>
      <div id="screen"></div>
    </main>
  </div>
</div>
<div class="launch" id="launch" hidden></div>
<div id="toast" hidden></div>

<script src="shared/garage.js"></script>
<script src="shared/lobby-core.js"></script>
<script src="shared/net.js"></script>
<script src="shared/avatars.js"></script>
<script src="shared/progress.js"></script>
<script>
(()=>{
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const{GAMES,MODES,SCORING}=LobbyCore,gameName=id=>(GAMES.find(g=>g.id===id)||{}).name||id;
const Net=GGNet,me=Net.me;
/* Ring zeigt den Status: grün = bereit/fertig, blau = spielt gerade, Gold/Silber/Bronze = Plätze bei der Siegerehrung */
const RING={ready:'var(--sea-ink)',play:'var(--water-ink)',gold:'#d4a017',silver:'#a9b1ba',bronze:'#c27c48'};
const av=(id,size=40,ring,mood)=>{const svg=Avatars.svg(id??0,size,{mood});return ring?`<span class="ring" style="--rc:${RING[ring]}">${svg}</span>`:svg;};
const medal=pl=>['gold','silver','bronze'][pl-1];
if(me.avatar==null)me.avatar=Math.floor(Math.random()*Avatars.count);
{const a=Avatars.split(me.avatar);me.avatar=Avatars.make(a.face,GGProgress.unlocked(a.hat)?a.hat:0,a.bg,GGProgress.shirtUnlocked(a.shirt)?a.shirt:0);}   // gesperrte Kopfbedeckung wieder abnehmen

const S={
  code:Net.ss.get('gg-room'),room:null,online:[],rooms:[],invites:[],screen:'menu',invited:{},
  lastSeed:Net.ss.get('gg-seed'),skew:0,myVotes:null,launchTimer:null,rejoin:null,named:!!me.name,
};
const inviteCode=(new URLSearchParams(location.search).get('raum')||'').toUpperCase().slice(0,4);

function toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,3200);}
function setRoom(room){S.room=room;S.code=room?room.code:null;Net.ss.set('gg-room',S.code);Net.remember(S.code);updateNav();}
const serverNow=()=>Date.now()+S.skew;
const total=r=>LobbyCore.totalGames(r);

/* ---------- Abfrage alle 1,5 Sekunden ---------- */
async function poll(){
  if(!S.named)return;
  const r=await Net.call({action:'poll',code:S.code});
  if(r.error)return;
  if(r.now)S.skew=r.now-Date.now();
  S.online=r.online;S.rooms=r.rooms;S.invites=r.invites||[];
  if(S.code){
    if(!r.room){setRoom(null);toast('Das Spiel gibt es nicht mehr.');if(S.screen==='lobby')show('menu');}
    else if(r.room.kicked){setRoom(null);toast('Du wurdest aus dem Spiel entfernt.');if(S.screen==='lobby')show('menu');}
    else{S.room=r.room;maybeLaunch();countTournament(r.room);}
  }
  renderInvites();updateNav();refresh();
}
/* Startet der Gastgeber ein Spiel, zählt bei allen ein Countdown runter, dann öffnet sich das Minispiel */
function gameUrl(r){return`${r.current.game}/?seed=${r.current.seed}&raum=${r.code}&r=${r.current.idx}`;}
function needsToPlay(r){return r&&r.status==='running'&&r.current&&r.results[r.current.idx]&&r.results[r.current.idx][me.pid]===undefined;}
function countTournament(room){
  if(room.status!=='final'||!room.results.length||!room.players.some(p=>p.pid===me.pid))return;
  const st=LobbyCore.standings(room),mine=st.find(x=>x.pid===me.pid);if(!mine)return;
  const fresh=GGProgress.recordTournament(`${room.code}:${room.created}:${room.results.length}:${room.playlist.join(',')}`,mine.place);
  if(fresh.length)toast(`Freigespielt: ${fresh.map(Avatars.unlockName).join(', ')}! Unter Einstellungen → Avatar.`);
}
function maybeLaunch(){
  const r=S.room;if(!needsToPlay(r))return;
  const c=r.current;if(String(c.seed)===String(S.lastSeed))return;
  if(serverNow()-c.startAt>8000)return;            // schon länger am Laufen: „Wieder beitreten“-Knopf statt automatisch
  S.lastSeed=String(c.seed);Net.ss.set('gg-seed',S.lastSeed);
  const L=$('#launch'),names=GAMES.map(g=>g.name);L.hidden=false;
  const tick=()=>{
    const left=c.startAt-serverNow(),slot=r.mode==='random'&&left>1600;
    L.innerHTML=`<div class="card"><div class="eyebrow">Spiel ${c.idx+1} von ${total(r)}${r.mode==='random'?' · Zufall':''}</div>
      <h2>${slot?esc(names[Math.floor(Date.now()/90)%names.length]):esc(gameName(c.game))}</h2><div class="num">${Math.max(0,Math.ceil(left/1000))}</div></div>`;
    if(left<=0){clearInterval(S.launchTimer);location.href=gameUrl(r);}
  };
  clearInterval(S.launchTimer);S.launchTimer=setInterval(tick,90);tick();
}

/* ---------- Navigation ---------- */
const nav=$('#nav');
nav.addEventListener('click',e=>{const b=e.target.closest('button[data-go]');if(!b||b.disabled)return;show(b.dataset.go==='multi'&&S.code?'lobby':b.dataset.go);});
function updateNav(){
  nav.hidden=!S.named;
  $('#navMultiInfo').textContent=S.code?`Raum ${S.code}`:S.rooms.length?`${S.rooms.length} offen`:'';
  const cur=S.screen==='lobby'?'multi':S.screen;
  nav.querySelectorAll('button[data-go]').forEach(b=>b.setAttribute('aria-current',String(b.dataset.go===cur)));

/* ---------- Aktionen ---------- */
async function join(code,{relaunch}={}){
  code=String(code||'').trim().toUpperCase();if(code.length!==4){toast('Der Code hat 4 Zeichen.');return;}
  const r=await Net.call({action:'join',code});if(r.error){toast(r.error);return;}
  setRoom(r.room);
  if(relaunch&&needsToPlay(r.room)){S.lastSeed=String(r.room.current.seed);Net.ss.set('gg-seed',S.lastSeed);location.href=gameUrl(r.room);return;}
  if(r.room.status==='running'&&r.room.current){S.lastSeed=String(r.room.current.seed);Net.ss.set('gg-seed',S.lastSeed);}
  show('lobby');
}
async function leave(silent){if(!S.code)return;await Net.call({action:'leave',code:S.code});setRoom(null);if(!silent){toast('Du hast den Warteraum verlassen.');show('menu');}}
async function act(action,extra){const r=await Net.call({action,code:S.code,...extra});if(r.error){toast(r.error);return null;}if(r.room){S.room=r.room;refresh();}return r;}

function playersHtml(r){
  const isHost=r.host===me.pid,st=r.status==='lobby'||r.status==='voting'?null:LobbyCore.standings(r),pts=st?Object.fromEntries(st.map(x=>[x.pid,x.total])):{};
  return r.players.map(p=>{
    let tag='',ring=null;
    if(r.status==='lobby'&&p.ready)ring='ready';
    if(r.status==='voting'&&Object.values(r.votes[p.pid]||{}).reduce((a,b)=>a+b,0)>=r.count)ring='ready';
    if(r.status==='running'&&r.current)ring=r.results[r.current.idx]&&r.results[r.current.idx][p.pid]!==undefined?'ready':'play';
    if(r.status==='lobby')tag=`<span class="tag ${p.ready?'ok':''}">${p.ready?'Bereit':'Wartet'}</span>`;
    else if(r.status==='voting'){const used=Object.values(r.votes[p.pid]||{}).reduce((a,b)=>a+b,0);tag=`<span class="tag ${used>=r.count?'ok':''}">${used>=r.count?'Abgestimmt':`${used}/${r.count} Stimmen`}</span>`;}
    else if(r.status==='running'&&r.current){const done=r.results[r.current.idx]&&r.results[r.current.idx][p.pid]!==undefined;tag=`<span class="tag ${done?'ok':'run'}">${done?'Fertig':'Spielt'}</span>`;}
    if(st)tag+=`<span class="meta">${GG.num(pts[p.pid]||0)} P.</span>`;
    return`<div class="item">${av(p.avatar,40,ring)}<div class="grow"><strong>${esc(p.name)}${p.pid===me.pid?' (du)':''}</strong>${p.pid===r.host?'<small style="color:var(--amber-ink)">Gastgeber</small>':''}</div>${tag}
      ${isHost&&p.pid!==me.pid&&r.status==='lobby'?`<button class="btn danger small" type="button" data-kick="${esc(p.pid)}">Entfernen</button>`:''}</div>`;}).join('');
}
function standingsHtml(r){

  <tbody>${st.map(x=>`<tr><td>${x.place}.</td><td><span class="pl">${av(x.avatar,28,r.status==='final'?medal(x.place):null)}${esc(x.name)}</span></td>${x.per.map(c=>`<td>${c?(r.scoring==='place'?`${c.pts}<small>${GG.num(c.score)}</small>`:GG.num(c.score)):'–'}</td>`).join('')}<td class="tot">${GG.num(x.total)}</td></tr>`).join('')}</tbody></table></div>

function playlistHtml(r){

    ${isHost?`<div class="row"><button class="btn" type="button" id="beginBtn"></button></div>`:''}</section>`;

function phaseKey(r){return JSON.stringify([r.status,r.mode,r.count,r.scoring,r.games,r.host===me.pid,r.playlist,r.results.length,r.current&&r.current.idx]);}
function renderPhase(){
  const r=S.room,isHost=r.host===me.pid,P=$('#phase');if(!P)return;

  else if(r.status==='final'){P.innerHTML=podiumHtml(r,isHost);}

      ${isHost?`<div class="row">${more?`<button class="btn" type="button" id="nextBtn">Spiel ${idx+1} von ${n} starten: ${esc(nextName)}</button>`:''}<button class="btn ${more?'sec':''}" type="button" id="finishBtn">${more?'Turnier vorzeitig beenden':'Zur Siegerehrung'}</button></div><span class="hint" id="doneHint"></span>`
        :`<p class="hint">${more?'Der Gastgeber startet das nächste Spiel, wenn alle so weit sind.':'Gleich kommt die Siegerehrung.'}</p>`}</section></div>
      <section class="box"><div class="label">Zwischenstand · ${esc(SCORING[r.scoring])}</div><div id="standings">${standingsHtml(r)}</div></section>`;
  }
}
function renderVotes(){
  const r=S.room,used=Object.values(S.myVotes).reduce((a,b)=>a+b,0),left=r.count-used,el=$('#voteList');if(!el)return;
  $('#votesLeft').textContent=`noch ${left} von ${r.count}`;
  el.innerHTML=GAMES.map(g=>{const n=S.myVotes[g.id]||0;return`<div class="vote"><div class="grow"><strong>${g.name}</strong> <small class="meta">${g.tag}</small></div>
    <button type="button" data-vm="${g.id}" aria-label="Eine Stimme weniger für ${g.name}"${n?'':' disabled'}>−</button><span class="n">${n}</span><button type="button" data-vp="${g.id}" aria-label="Eine Stimme mehr für ${g.name}"${left?'':' disabled'}>+</button></div>`;}).join('');
}
function podiumHtml(r,isHost){
  const st=LobbyCore.standings(r),top=[st[1],st[0],st[2]];
  const pod=(x,cls)=>x?`<div class="pod ${cls}">${av(x.avatar,cls==='p1'?88:68,medal(x.place),x.place===1?'win':'happy')}<strong>${esc(x.name)}</strong><span class="pts">${GG.num(x.total)} Punkte</span><div class="step">${x.place}</div></div>`:'<div></div>';
  const rest=st.slice(3);
  return`<section class="box" style="align-items:stretch"><div class="label" style="text-align:center">Siegerehrung · ${esc(r.title)}</div><h2 style="text-align:center">${st[0]?`${esc(st[0].name)} gewinnt!`:'Turnier beendet'}</h2>
    <div class="podium">${pod(top[0],'p2')}${pod(top[1],'p1')}${pod(top[2],'p3')}</div>
    ${rest.length?`<div class="list">${rest.map(x=>`<div class="item"><span class="meta" style="width:3ch">${x.place}.</span>${av(x.avatar,36)}<div class="grow"><strong>${esc(x.name)}</strong></div><span class="meta">${GG.num(x.total)} Punkte</span></div>`).join('')}</div>`:''}
    <div class="row" style="justify-content:center">${isHost?'<button class="btn" type="button" id="resetBtn">Neues Turnier</button>':''}<button class="btn danger" type="button" id="leaveBtn">Warteraum verlassen</button></div></section>
    <section class="box"><div class="label">Alle Ergebnisse · ${esc(SCORING[r.scoring])}</div>${standingsHtml(r)}</section>`;
}
function lobbyLive(){
  const r=S.room,isHost=r.host===me.pid,el=id=>document.getElementById(id);if(!el('phase'))return;
  if(el('lTitle').textContent!==r.title)el('lTitle').textContent=r.title;
  el('lVis').textContent=`Warteraum · ${r.public?'offen für alle':'nur mit Einladung'}`;
  el('lInfo').textContent=`${MODES[r.mode]} · ${total(r)} ${total(r)===1?'Spiel':'Spiele'} · ${SCORING[r.scoring]}`;
  renderPhase();
  if(el('players')){el('players').innerHTML=playersHtml(r);el('pCount').textContent=`${r.players.length} / ${r.max}`;}
  if(el('standings'))el('standings').innerHTML=standingsHtml(r);
  const rb=el('readyBtn');if(rb){const mine=r.players.find(p=>p.pid===me.pid)||{};rb.textContent=mine.ready?'Doch nicht bereit':'Bereit';rb.className=mine.ready?'btn sec':'btn';}
  const bb=el('beginBtn');if(bb){const nr=r.players.filter(p=>!p.ready).length,n=total(r);bb.textContent=`${r.mode==='vote'?'Abstimmung starten':'Turnier starten'} · ${n} ${n===1?'Spiel':'Spiele'}${nr?` (${nr} nicht bereit)`:''}`;}
  const dh=el('doneHint');if(dh&&r.status==='running'&&r.current){const res=r.results[r.current.idx]||{},d=r.players.filter(p=>res[p.pid]!==undefined).length;dh.textContent=`${gameName(r.current.game)}: ${d} von ${r.players.length} fertig. Wer noch spielt, wird beim nächsten Start mitgenommen.`;}
  el('runBanner').innerHTML=r.status==='running'&&r.current?(needsToPlay(r)
      ?`<div class="banner"><div class="grow"><div class="label">Spiel ${r.current.idx+1} von ${total(r)} läuft</div><strong>${esc(gameName(r.current.game))}</strong> · du hast noch kein Ergebnis</div><a class="btn" href="${gameUrl(r)}">Wieder beitreten</a></div>`
      :`<div class="banner"><div class="grow"><div class="label">Spiel ${r.current.idx+1} von ${total(r)}</div><strong>${esc(gameName(r.current.game))}</strong> · dein Ergebnis ist gespeichert</div></div>`):'';
  const ib=el('inviteBox');ib.hidden=r.status==='final';
  const free=S.online.filter(o=>!o.room&&!r.players.some(p=>p.pid===o.pid));
  el('inviteList').innerHTML=free.length?free.map(o=>`<div class="item">${av(o.avatar,36)}<div class="grow"><strong>${esc(o.name)}</strong><span class="meta">im Menü</span></div>
    <button class="btn small${S.invited[o.pid]?' sec':''}" type="button" data-inv="${esc(o.pid)}"${S.invited[o.pid]?' disabled':''}>${S.invited[o.pid]?'Eingeladen':'Einladen'}</button></div>`).join('')
    :`<div class="empty">Gerade ist niemand frei im Menü. Teile den Code oder den Link.</div>`;
}
function vSettings(){
  const s=GG.settings,sl=(id,label,v)=>{v=Math.round(v/10)*10;return`<div class="slider"><label for="${id}">${label}</label><button type="button" class="step" data-vol="${id}" data-d="-10" aria-label="${label} leiser"${v<=0?' disabled':''}>−</button><input type="range" id="${id}" min="0" max="100" step="10" value="${v}" style="--p:${v}%"><button type="button" class="step" data-vol="${id}" data-d="10" aria-label="${label} lauter"${v>=100?' disabled':''}>+</button><output id="${id}Out" for="${id}">${v} %</output></div>`;}
  const th=s.theme==='dark'?'dark':'light';
  return`<section class="box"><div class="label">Einstellungen</div><h2>Darstellung</h2>
    <div class="field"><span class="label">Farben</span><div class="seg" role="radiogroup" aria-label="Farben"><label><input type="radio" name="theme" value="light"${th==='light'?' checked':''}><span>Hell</span></label><label><input type="radio" name="theme" value="dark"${th==='dark'?' checked':''}><span>Dunkel</span></label></div>
      <span class="hint">Gilt für das Menü und alle Minispiele.</span></div></section>
  <section class="box"><h2>Bild</h2>
    <div class="field"><span class="label">Auflösung der Spiele</span><div class="seg res" role="radiogroup" aria-label="Auflösung">
      ${[['auto','Automatisch','Bildschirm'],['720','720p','1280 × 720'],['1080','1080p','1920 × 1080'],['1440','1440p','2560 × 1440']].map(([v,t,d])=>`<label><input type="radio" name="res" value="${v}"${s.resolution===v?' checked':''}><span>${t}<small>${d}</small></span></label>`).join('')}</div>
      <span class="hint">Niedriger läuft auf schwachen Rechnern flüssiger. Gilt ab dem nächsten gestarteten Minispiel.</span></div>
    <div class="row"><button class="btn sec" type="button" id="fsBtn">${document.fullscreenElement?'Vollbild beenden':'Vollbild'}</button></div></section>
  <section class="box"><h2>Ton</h2>
    ${sl('vMaster','Gesamtlautstärke',s.master)}${sl('vMusic','Musik',s.music)}${sl('vSfx','Effekte',s.sfx)}
    <div class="row"><button class="btn sec small" type="button" id="testSfx">Effekt testen</button></div></section>
  <section class="box"><h2>Spieler</h2>
    <form id="renameForm" class="list" style="gap:16px"><div class="who-row"><button type="button" class="avbtn" id="avBtn2" aria-label="Avatar ändern" aria-expanded="false">${av(me.avatar,72)}</button>
      <div class="field" style="flex:1;min-width:200px"><label class="label" for="renameIn">Name</label><div class="row"><input type="text" id="renameIn" maxlength="20" value="${esc(me.name)}" style="flex:1;min-width:160px"><button class="btn sec" type="submit">Speichern</button></div><span class="hint" id="renameHint"></span></div></div>
      ${avatarPicker('avGrid2')}</form></section>`;
}
function vQuit(){return`<section class="box"><div class="label">Spiel beenden</div><h2>Wirklich beenden?</h2>
  <p>${S.code?'Du verlässt dabei auch den Warteraum. ':''}Die Musik geht aus und das Fenster wird geschlossen, wenn der Browser es erlaubt.</p>
  <div class="row"><button class="btn danger" type="button" id="quitYes">Ja, beenden</button><button class="btn sec" type="button" data-go2="${S.code?'lobby':'menu'}">Abbrechen</button></div></section>`;}
function vBye(){return`<section class="box"><div class="label">Beendet</div><h2>Bis zum nächsten Mal!</h2><p>Du kannst das Fenster jetzt schließen.</p><div class="row"><button class="btn sec" type="button" id="backMenu">Zurück zum Menü</button></div></section>`;}

/* ---------- Ereignisse ---------- */
screen.addEventListener('click',e=>{const b=e.target.closest('[data-go2]');if(b)show(b.dataset.go2);const j=e.target.closest('[data-join]');if(j&&!j.disabled)join(j.dataset.join);});
let nameTimer=null;
async function checkName(input,hint,btn){
  const n=input.value.trim();clearTimeout(nameTimer);
  if(!n){hint.textContent='';hint.className='hint';if(btn)btn.disabled=true;return;}
  nameTimer=setTimeout(async()=>{const r=await Net.call({action:'checkName',name:n});if(input.value.trim()!==n)return;
    hint.textContent=r.taken?`„${n}“ ist schon vergeben. Bitte nimm einen anderen Namen.`:`„${n}“ ist frei.`;hint.className=r.taken?'hint bad':'hint good';if(btn)btn.disabled=!!r.taken;},250);
}
const bind={
  name(){
    const input=$('#nameIn'),hint=$('#nameHint'),go=$('#nameGo');input.focus();
    bindPicker('avBtn','avGrid');
    input.addEventListener('input',()=>checkName(input,hint,go));checkName(input,hint,go);
    $('#nameForm').addEventListener('submit',async e=>{e.preventDefault();const n=input.value.trim().slice(0,20);if(!n)return;
      me.name=n;const r=await Net.call({action:'claim',name:n});
      if(r.error){me.name='';hint.textContent=r.error;hint.className='hint bad';go.disabled=true;return;}
      S.named=true;
      if(inviteCode){history.replaceState(null,'',location.pathname);join(inviteCode);}else show('menu');poll();});
    if(S.rejoin){
      $('#rejoinBtn').addEventListener('click',async()=>{const l=S.rejoin;me.pid=l.pid;me.name=l.name;if(l.avatar!=null)me.avatar=l.avatar;S.named=true;S.rejoin=null;await join(l.code,{relaunch:true});poll();});
      $('#rejoinNo').addEventListener('click',()=>{Net.remember(null);S.rejoin=null;render();});
    }
  },
  multi(){$('#createForm').addEventListener('submit',async e=>{e.preventDefault();
    const r=await Net.call({action:'create',title:$('#cTitle').value,public:document.querySelector('input[name=vis]:checked').value==='1',max:$('#cMax').value});
    if(r.error){toast(r.error);return;}setRoom(r.room);show('lobby');});
    $('#codeIn').addEventListener('input',e=>e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,''));
    $('#codeForm').addEventListener('submit',e=>{e.preventDefault();join($('#codeIn').value);});},
  lobby(){
    if(!S.room)return;S.myVotes=null;
    $('#copyLink').addEventListener('click',async()=>{const i=$('#linkIn');try{await navigator.clipboard.writeText(i.value);toast('Link kopiert.');}catch(e){i.select();toast('Link markiert – jetzt mit Strg+C kopieren.');}});
    const P=$('#phase');
    P.addEventListener('click',async e=>{
      const t=e.target.closest('button');if(!t)return;
      if(t.id==='readyBtn'){const mine=S.room.players.find(p=>p.pid===me.pid);act('ready',{ready:!(mine&&mine.ready)});}
      if(t.id==='leaveBtn')leave();
      if(t.dataset.kick)act('kick',{target:t.dataset.kick});
      if(t.id==='beginBtn')act('begin');
      if(t.id==='closeVoteBtn')act('closeVote');
      if(t.id==='nextBtn'){const r=await act('next');if(r&&r.room)maybeLaunch();}
      if(t.id==='finishBtn')act('finish');
      if(t.id==='resetBtn')act('reset');
      if(t.dataset.vp||t.dataset.vm){const id=t.dataset.vp||t.dataset.vm;S.myVotes[id]=Math.max(0,(S.myVotes[id]||0)+(t.dataset.vp?1:-1));renderVotes();act('vote',{votes:S.myVotes});}
    });
    P.addEventListener('change',e=>{
      const t=e.target;
      if(t.name==='mode')act('settings',{mode:t.value});
      if(t.name==='scoring')act('settings',{scoring:t.value});
      if(t.id==='sCount')act('settings',{count:t.value});
      if(t.dataset.g){const games=[...document.querySelectorAll('[data-g]:checked')].map(i=>i.dataset.g);if(!games.length){t.checked=true;toast('Mindestens ein Minispiel muss dabei sein.');return;}act('settings',{games});}
    });
    $('#inviteList').addEventListener('click',async e=>{const b=e.target.closest('[data-inv]');if(!b)return;
      const r=await Net.call({action:'invite',code:S.code,target:b.dataset.inv});if(r.error){toast(r.error);return;}
      S.invited[b.dataset.inv]=true;setTimeout(()=>{delete S.invited[b.dataset.inv];},15000);toast('Einladung verschickt.');lobbyLive();});
  },
  settings(){
    screen.querySelectorAll('input[name=theme]').forEach(r=>r.addEventListener('change',e=>{GG.saveSettings({theme:e.target.value});toast(e.target.value==='dark'?'Dunkelmodus an.':'Helle Farben an.');}));
    screen.querySelectorAll('input[name=res]').forEach(r=>r.addEventListener('change',e=>{GG.saveSettings({resolution:e.target.value});toast('Gespeichert. Gilt ab dem nächsten Minispiel.');}));
    $('#fsBtn').addEventListener('click',async e=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(err){toast('Vollbild geht hier nicht. Drück F11.');}setTimeout(()=>{e.target.textContent=document.fullscreenElement?'Vollbild beenden':'Vollbild';},200);});
    const KEYS={vMaster:'master',vMusic:'music',vSfx:'sfx'};
    const setVol=(id,v)=>{v=Math.max(0,Math.min(100,Math.round(v/10)*10));const r=$('#'+id);r.value=v;r.style.setProperty('--p',v+'%');$('#'+id+'Out').textContent=v+' %';
      screen.querySelectorAll(`[data-vol="${id}"]`).forEach(b=>b.disabled=(+b.dataset.d<0&&v<=0)||(+b.dataset.d>0&&v>=100));GG.musicStart();GG.saveSettings({[KEYS[id]]:v});};
    Object.keys(KEYS).forEach(id=>$('#'+id).addEventListener('input',e=>setVol(id,+e.target.value)));
    screen.querySelectorAll('[data-vol]').forEach(b=>b.addEventListener('click',()=>{setVol(b.dataset.vol,+$('#'+b.dataset.vol).value+ +b.dataset.d);if(b.dataset.vol==='vSfx')GG.sfx('tick');}));
    $('#testSfx').addEventListener('click',()=>GG.sfx('win'));
    const ri=$('#renameIn'),rh=$('#renameHint');
    bindPicker('avBtn2','avGrid2',()=>{updateNav();if(S.code)Net.call({action:'join',code:S.code});toast('Avatar gespeichert.');});
    ri.addEventListener('input',()=>{if(ri.value.trim().toLowerCase()===me.name.toLowerCase()){rh.textContent='';return;}checkName(ri,rh,null);});
    $('#renameForm').addEventListener('submit',async e=>{e.preventDefault();const n=ri.value.trim().slice(0,20);if(!n||n===me.name)return;
      const old=me.name;me.name=n;const r=await Net.call({action:'claim',name:n});
      if(r.error){me.name=old;rh.textContent=r.error;rh.className='hint bad';return;}
      updateNav();toast('Name gespeichert.');if(S.code)Net.call({action:'join',code:S.code});});
  },
  quit(){$('#quitYes').addEventListener('click',async()=>{await leave(true);GG.musicStop();try{window.close();}catch(e){}show('bye');});},
  bye(){$('#backMenu').addEventListener('click',()=>{GG.musicStart();show('menu');});},
};

/* ---------- Start ---------- */
(async()=>{
  await Net.init();
  $('#conn').classList.add(Net.mode==='server'?'on':'off');$('#connText').textContent=Net.mode==='server'?'Server verbunden':'Offline-Modus';
  if(S.named&&S.code){const r=await Net.call({action:'poll',code:S.code});if(r.room&&!r.room.kicked){S.room=r.room;S.screen='lobby';}else setRoom(null);}
  // Neuer Tab oder nach einem Absturz: letzten Raum anbieten
  if(!S.named){const l=Net.last();if(l){const pid=me.pid;me.pid=l.pid;const r=await Net.call({action:'poll',code:l.code,name:l.name,avatar:l.avatar});me.pid=pid;
    if(r.room&&!r.room.kicked&&r.room.players.some(p=>p.pid===l.pid))S.rejoin={...l,title:r.room.title,running:r.room.status==='running',game:r.room.current&&r.room.current.game};else Net.remember(null);}}
  if(S.named&&inviteCode&&inviteCode!==S.code){history.replaceState(null,'',location.pathname);if(S.code)await leave(true);await join(inviteCode);}
  updateNav();render();poll();setInterval(poll,1500);
})();
})();
</script>
</body>
</html>
